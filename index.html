<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width">
  <title>FSA Test</title>
</head>

<body>

<button onclick="setup()">1. SETUP FILE</button>
<button onclick="removeFile()">2. HANDLE.REMOVE()</button>
<button onclick="check()">3. CHECK</button>

<pre id="log"></pre>

<script>

let fileHandle = null;

function log(x) {
  document.getElementById("log").textContent += x + "\n";
}

async function setup() {

  document.getElementById("log").textContent = "";

  try {

    log("=== FILE PICKER SETUP ===");

    const files = await showOpenFilePicker({
      multiple: false,
      mode: "readwrite"
    });

    fileHandle = files[0];

    log("FILE HANDLE: OK");
    log("kind = " + fileHandle.kind);
    log("name = " + fileHandle.name);

    log(
      "read = " +
      await fileHandle.queryPermission({
        mode: "read"
      })
    );

    log(
      "readwrite = " +
      await fileHandle.queryPermission({
        mode: "readwrite"
      })
    );

    const file = await fileHandle.getFile();

    log("CONTENT = " + await file.text());

  } catch (e) {

    log("SETUP ERROR: " + e.name);
    log(e.message);

  }
}


async function removeFile() {

  if (!fileHandle) {
    log("ERROR: SETUP FILE terlebih dahulu");
    return;
  }

  log("");
  log("=== HANDLE.REMOVE ===");

  try {

    await fileHandle.remove();

    log("handle.remove(): SUCCESS");

  } catch (e) {

    log("handle.remove(): " + e.name);
    log(e.message);

  }

  try {

    log(
      "read after remove = " +
      await fileHandle.queryPermission({
        mode: "read"
      })
    );

    log(
      "readwrite after remove = " +
      await fileHandle.queryPermission({
        mode: "readwrite"
      })
    );

  } catch (e) {

    log("PERMISSION ERROR: " + e.name);

  }

  try {

    const file = await fileHandle.getFile();

    log("OLD HANDLE READ: SUCCESS");
    log("CONTENT = " + await file.text());

  } catch (e) {

    log("OLD HANDLE READ: " + e.name);

  }

}


async function check() {

  if (!fileHandle) {
    log("ERROR: SETUP FILE terlebih dahulu");
    return;
  }

  log("");
  log("=== CHECK ===");

  try {

    log(
      "old read = " +
      await fileHandle.queryPermission({
        mode: "read"
      })
    );

    log(
      "old readwrite = " +
      await fileHandle.queryPermission({
        mode: "readwrite"
      })
    );

  } catch (e) {

    log("PERMISSION ERROR: " + e.name);

  }

  try {

    const file = await fileHandle.getFile();

    log("OLD HANDLE READ: SUCCESS");
    log("CONTENT = " + await file.text());

  } catch (e) {

    log("OLD HANDLE READ: " + e.name);
    log(e.message);

  }

}

</script>

</body>
</html>
