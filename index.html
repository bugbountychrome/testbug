<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edge InPrivate Permission Test</title>
</head>

<body>
  <h2>Edge Location Permission Test</h2>

  <button onclick="testLocation()">TEST LOCATION</button>

  <pre id="result">Belum dites.</pre>

  <script>
    async function testLocation() {
      const result = document.getElementById("result");

      result.textContent = "Checking permission...\n";

      if (!navigator.geolocation) {
        result.textContent += "Geolocation API NOT available";
        return;
      }

      try {
        const permission = await navigator.permissions.query({
          name: "geolocation"
        });

        result.textContent +=
          "Permission state: " + permission.state + "\n\n";

        permission.onchange = () => {
          result.textContent +=
            "Permission changed → " + permission.state + "\n";
        };

        navigator.geolocation.getCurrentPosition(
          position => {
            result.textContent +=
              "SUCCESS\n" +
              "Latitude: " + position.coords.latitude + "\n" +
              "Longitude: " + position.coords.longitude + "\n" +
              "Accuracy: " + position.coords.accuracy + "m\n";
          },

          error => {
            result.textContent +=
              "ERROR\n" +
              "Code: " + error.code + "\n" +
              "Message: " + error.message + "\n";
          },

          {
            enableHighAccuracy: false,
            timeout: 10000,
            maximumAge: 0
          }
        );

      } catch (e) {
        result.textContent +=
          "EXCEPTION: " + e + "\n";
      }
    }
  </script>
</body>
</html>
