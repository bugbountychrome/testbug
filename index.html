<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    html, body {
        margin: 0;
        height: 100%;
    }

    h1 {
        margin: 1em;
    }

    /* Overlay menutupi seluruh viewport, termasuk saat fullscreen */
    a {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 9999;
        -webkit-tap-highlight-color: transparent;
    }

    input {
        display: none;
    }

    img {
        width: 100%;
    }
</style>
</head>
<body>

<h1>Tap to upload photo</h1>

<!-- [poc-with-system-dialog]: -->
<input id="fileSelect" type="file" accept="image/*" />

<!-- [poc-with-camera]: -->
<!-- <input id="fileSelect" type="file" accept="*/*" /> -->

<img id="img">

<!-- href="#self" + preventDefault: tetap di halaman ini, TIDAK navigasi.
     Overlay pakai position:fixed 100vw×100vh → full layar -->
<a id="link" href="#"></a>

<script>
    link.onclick = (e) => {
        e.preventDefault();      // ← kunci: cegah navigasi/hash-jump
        fileSelect.click();      // picker dipanggil dalam gesture yang sama
    };

    fileSelect.onchange = (event) => {
        img.src = URL.createObjectURL(fileSelect.files[0]);
        // opsional: kembali ke fullscreen setelah file dipilih
        // document.documentElement.requestFullscreen().catch(() => {});
    };
</script>

</body>
</html>
