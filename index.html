<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mali / ANGLE WebGL2 baseline diagnostic v5</title>
<style>
body{background:#111;color:#eee;font:15px monospace;padding:16px;line-height:1.4}
button{font:inherit;padding:12px 16px;margin:4px 4px 10px 0}
pre{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<h2>Mali / ANGLE WebGL2 baseline diagnostic v5</h2>
<p>Benign diagnostic. First establishes valid WebGL2 FBO baselines, then tests BASE_LEVEL and blit.</p>
<button id="run">Run diagnostic</button>
<pre id="out">Ready.</pre>

<script>
"use strict";

const out = document.getElementById("out");
const log = s => { out.textContent += s + "\n"; console.log(s); };
const clear = () => out.textContent = "";

function statusName(gl,s){
  const m={
    [gl.FRAMEBUFFER_COMPLETE]:"FRAMEBUFFER_COMPLETE",
    [gl.FRAMEBUFFER_INCOMPLETE_ATTACHMENT]:"FRAMEBUFFER_INCOMPLETE_ATTACHMENT",
    [gl.FRAMEBUFFER_INCOMPLETE_MISSING_ATTACHMENT]:"FRAMEBUFFER_INCOMPLETE_MISSING_ATTACHMENT",
    [gl.FRAMEBUFFER_INCOMPLETE_DIMENSIONS]:"FRAMEBUFFER_INCOMPLETE_DIMENSIONS",
    [gl.FRAMEBUFFER_UNSUPPORTED]:"FRAMEBUFFER_UNSUPPORTED"
  };
  return m[s] || ("0x"+s.toString(16));
}

function errName(gl,e){
  const m={
    [gl.NO_ERROR]:"NO_ERROR",
    [gl.INVALID_ENUM]:"INVALID_ENUM",
    [gl.INVALID_VALUE]:"INVALID_VALUE",
    [gl.INVALID_OPERATION]:"INVALID_OPERATION",
    [gl.OUT_OF_MEMORY]:"OUT_OF_MEMORY",
    [gl.INVALID_FRAMEBUFFER_OPERATION]:"INVALID_FRAMEBUFFER_OPERATION"
  };
  return m[e] || ("0x"+e.toString(16));
}

function drain(gl){
  const a=[]; let e;
  while((e=gl.getError())!==gl.NO_ERROR)a.push(errName(gl,e));
  return a;
}

/*
 * Conservative texture allocation:
 * - RGBA / UNSIGNED_BYTE
 * - no mipmap filtering requirement
 * - explicitly allocate the exact level being attached
 */
function tex(gl,w,h){
  const t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texImage2D(
    gl.TEXTURE_2D,0,gl.RGBA,w,h,0,
    gl.RGBA,gl.UNSIGNED_BYTE,null
  );
  gl.bindTexture(gl.TEXTURE_2D,null);
  return t;
}

function mipTex(gl,baseW,baseH,levels){
  const t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST_MIPMAP_NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

  let w=baseW,h=baseH;
  for(let l=0;l<levels;l++){
    gl.texImage2D(
      gl.TEXTURE_2D,l,gl.RGBA,w,h,0,
      gl.RGBA,gl.UNSIGNED_BYTE,null
    );
    w=Math.max(1,w>>1);
    h=Math.max(1,h>>1);
  }
  gl.bindTexture(gl.TEXTURE_2D,null);
  return t;
}

function makeFbo(gl, attachments){
  const f=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,f);

  for(const a of attachments){
    gl.framebufferTexture2D(
      gl.FRAMEBUFFER,a.attachment,
      gl.TEXTURE_2D,a.texture,a.level
    );
  }

  const buffers=attachments.map(a=>a.attachment);
  gl.drawBuffers(buffers);
  return f;
}

function check(gl,name){
  const s=gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  const ok=s===gl.FRAMEBUFFER_COMPLETE;
  log((ok?"[PASS] ":"[FAIL] ")+name+" — "+statusName(gl,s));
  return ok;
}

function deleteFbo(gl,f,...textures){
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.deleteFramebuffer(f);
  for(const t of textures)gl.deleteTexture(t);
  drain(gl);
}

function caseA(gl){
  log("\n=== A: conservative single attachment baseline ===");
  const t=tex(gl,64,64);
  const f=makeFbo(gl,[{attachment:gl.COLOR_ATTACHMENT0,texture:t,level:0}]);
  const ok=check(gl,"single 64x64 RGBA/UNSIGNED_BYTE level 0");
  deleteFbo(gl,f,t);
  return ok;
}

function caseB(gl){
  log("\n=== B: explicit level-1 attachment baseline ===");
  const t=mipTex(gl,64,64,2);
  const f=makeFbo(gl,[{attachment:gl.COLOR_ATTACHMENT0,texture:t,level:1}]);
  const ok=check(gl,"single 32x32 mip level 1");
  deleteFbo(gl,f,t);
  return ok;
}

function caseC(gl){
  log("\n=== C: two equal-size color attachments ===");
  const a=tex(gl,32,32);
  const b=tex(gl,32,32);
  const f=makeFbo(gl,[
    {attachment:gl.COLOR_ATTACHMENT0,texture:a,level:0},
    {attachment:gl.COLOR_ATTACHMENT1,texture:b,level:0}
  ]);
  const ok=check(gl,"two 32x32 color attachments");
  deleteFbo(gl,f,a,b);
  return ok;
}

function caseD(gl){
  log("\n=== D: BASE_LEVEL=1 on one 64x64 texture ===");
  const t=mipTex(gl,64,64,2);
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_BASE_LEVEL,1);
  gl.bindTexture(gl.TEXTURE_2D,null);

  const f=makeFbo(gl,[{
    attachment:gl.COLOR_ATTACHMENT0,texture:t,level:1
  }]);

  const ok=check(gl,"single attachment level 1 + BASE_LEVEL=1");
  deleteFbo(gl,f,t);
  return ok;
}

function caseE(gl){
  log("\n=== E: two attachments + BASE_LEVEL=1 ===");
  const a=mipTex(gl,64,64,2);
  const b=mipTex(gl,64,64,2);

  for(const t of [a,b]){
    gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_BASE_LEVEL,1);
  }
  gl.bindTexture(gl.TEXTURE_2D,null);

  const f=makeFbo(gl,[
    {attachment:gl.COLOR_ATTACHMENT0,texture:a,level:1},
    {attachment:gl.COLOR_ATTACHMENT1,texture:b,level:1}
  ]);

  const ok=check(gl,"two 32x32 attachments + BASE_LEVEL=1");
  deleteFbo(gl,f,a,b);
  return ok;
}

function caseF(gl){
  log("\n=== F: valid source/destination + glBlitFramebuffer ===");

  const srcTex=mipTex(gl,64,64,2);
  const a=mipTex(gl,64,64,2);
  const b=mipTex(gl,64,64,2);

  for(const t of [a,b]){
    gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_BASE_LEVEL,1);
  }
  gl.bindTexture(gl.TEXTURE_2D,null);

  const src=makeFbo(gl,[{
    attachment:gl.COLOR_ATTACHMENT0,texture:srcTex,level:1
  }]);

  const dst=makeFbo(gl,[
    {attachment:gl.COLOR_ATTACHMENT0,texture:a,level:1},
    {attachment:gl.COLOR_ATTACHMENT1,texture:b,level:1}
  ]);

  gl.bindFramebuffer(gl.READ_FRAMEBUFFER,src);
  const srcStatus=gl.checkFramebufferStatus(gl.READ_FRAMEBUFFER);

  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,dst);
  const dstStatus=gl.checkFramebufferStatus(gl.DRAW_FRAMEBUFFER);

  log("source:      "+statusName(gl,srcStatus));
  log("destination: "+statusName(gl,dstStatus));

  let ok=false;
  if(srcStatus===gl.FRAMEBUFFER_COMPLETE &&
     dstStatus===gl.FRAMEBUFFER_COMPLETE){
    drain(gl);
    for(let i=0;i<50;i++){
      gl.blitFramebuffer(
        0,0,32,32,
        0,0,32,32,
        gl.COLOR_BUFFER_BIT,
        gl.NEAREST
      );
    }
    gl.finish();
    const errors=drain(gl);
    ok=errors.length===0;
    log(ok
      ? "[PASS] glBlitFramebuffer — no GL errors"
      : "[FAIL] glBlitFramebuffer — "+errors.join(", "));
  }else{
    log("[SKIP] glBlitFramebuffer — source/destination FBO not complete");
  }

  deleteFbo(gl,src,srcTex);
  deleteFbo(gl,dst,a,b);
  return ok;
}

function run(){
  clear();

  const canvas=document.createElement("canvas");
  canvas.width=64; canvas.height=64;

  const gl=canvas.getContext("webgl2",{
    antialias:false,
    depth:false,
    stencil:false,
    preserveDrawingBuffer:false
  });

  if(!gl){
    log("[FAIL] WebGL2 unavailable");
    return;
  }

  log("Renderer: "+gl.getParameter(gl.RENDERER));
  log("Vendor:   "+gl.getParameter(gl.VENDOR));
  log("Version:  "+gl.getParameter(gl.VERSION));
  log("GLSL:     "+gl.getParameter(gl.SHADING_LANGUAGE_VERSION));

  canvas.addEventListener("webglcontextlost",e=>{
    e.preventDefault();
    log("[!!!] WEBGL CONTEXT LOST");
  });
  canvas.addEventListener("webglcontextrestored",()=>{
    log("[!!!] WEBGL CONTEXT RESTORED");
  });

  const results=[];
  try{
    results.push(["A",caseA(gl)]);
    results.push(["B",caseB(gl)]);
    results.push(["C",caseC(gl)]);
    results.push(["D",caseD(gl)]);
    results.push(["E",caseE(gl)]);
    results.push(["F",caseF(gl)]);
  }catch(e){
    log("\n[!!!] Diagnostic aborted: "+(e.stack||e));
  }

  log("\n=== SUMMARY ===");
  for(const [n,ok] of results) log(n+": "+(ok?"PASS":"FAIL"));
  log(gl.isContextLost()
    ? "[!!!] WebGL context is LOST"
    : "[+] WebGL context remains active");
}

document.getElementById("run").addEventListener("click",run);
</script>
</body>
</html>
