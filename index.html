<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mali / ANGLE WebGL2 regression diagnostic v4</title>
<style>
body{background:#111;color:#eee;font:15px monospace;padding:16px;line-height:1.4}
button{font:inherit;padding:12px 16px;margin:4px 4px 10px 0}
pre{white-space:pre-wrap;word-break:break-word}
.pass{color:#9f9}.fail{color:#f88}.info{color:#9cf}
</style>
</head>
<body>
<h2>Mali / ANGLE WebGL2 regression diagnostic v4</h2>
<p>Benign diagnostic. It only tests framebuffer completeness and blit behavior.</p>
<button id="run">Run diagnostic</button>
<pre id="out">Ready.</pre>

<script>
"use strict";

const out = document.getElementById("out");
function log(s=""){ out.textContent += s + "\n"; console.log(s); }
function clear(){ out.textContent = ""; }

function errorName(gl, e) {
  const m = {
    0x0000:"NO_ERROR",
    0x0500:"INVALID_ENUM",
    0x0501:"INVALID_VALUE",
    0x0502:"INVALID_OPERATION",
    0x0503:"OUT_OF_MEMORY",
    0x0506:"INVALID_FRAMEBUFFER_OPERATION",
    0x8CD5:"FRAMEBUFFER_INCOMPLETE_ATTACHMENT",
    0x8CD6:"FRAMEBUFFER_INCOMPLETE_MISSING_ATTACHMENT",
    0x8CD7:"FRAMEBUFFER_INCOMPLETE_DIMENSIONS",
    0x8CDD:"FRAMEBUFFER_UNSUPPORTED",
    0x8219:"FRAMEBUFFER_INCOMPLETE_MULTISAMPLE"
  };
  return m[e] || ("0x" + e.toString(16));
}

function drain(gl) {
  const a=[];
  let e;
  while((e=gl.getError()) !== gl.NO_ERROR) a.push(errorName(gl,e));
  return a;
}

function allocTexture(gl, size=64, levels=4) {
  const t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST_MIPMAP_NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

  let w=size,h=size;
  for(let l=0;l<levels;l++){
    gl.texImage2D(
      gl.TEXTURE_2D,l,gl.RGBA8,w,h,0,
      gl.RGBA,gl.UNSIGNED_BYTE,null
    );
    w=Math.max(1,w>>1);
    h=Math.max(1,h>>1);
  }
  gl.bindTexture(gl.TEXTURE_2D,null);
  return t;
}

function makeFbo(gl){
  return gl.createFramebuffer();
}

function attach(gl,fbo,attachment,tex,level){
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(
    gl.FRAMEBUFFER,attachment,gl.TEXTURE_2D,tex,level
  );
}

function status(gl){
  return gl.checkFramebufferStatus(gl.FRAMEBUFFER);
}

function result(name, ok, detail=""){
  log((ok ? "[PASS] " : "[FAIL] ") + name + (detail ? " — " + detail : ""));
  return ok;
}

/*
 * Diagnostic matrix:
 * A: baseline, one attachment at level 0
 * B: one attachment at level 1, BASE_LEVEL=1
 * C: two attachments, both level 1, BASE_LEVEL=1
 * D: two attachments, one BASE_LEVEL=1 and one BASE_LEVEL=0
 * E: same as C, then actual blit
 *
 * Each case is isolated in fresh textures/FBOs.
 */
function runCases(gl){
  log("=== FRAMEBUFFER DIAGNOSTIC MATRIX ===");

  // A
  {
    const tex=allocTexture(gl);
    const f=makeFbo(gl);
    attach(gl,f,gl.COLOR_ATTACHMENT0,tex,0);
    const s=status(gl);
    result(
      "A. single attachment / level 0",
      s===gl.FRAMEBUFFER_COMPLETE,
      "status="+errorName(gl,s)
    );
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.deleteFramebuffer(f); gl.deleteTexture(tex);
    drain(gl);
  }

  // B
  {
    const tex=allocTexture(gl);
    const f=makeFbo(gl);
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_BASE_LEVEL,1);
    gl.bindTexture(gl.TEXTURE_2D,null);

    attach(gl,f,gl.COLOR_ATTACHMENT0,tex,1);
    const s=status(gl);
    result(
      "B. single attachment / level 1 / BASE_LEVEL=1",
      s===gl.FRAMEBUFFER_COMPLETE,
      "status="+errorName(gl,s)
    );
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.deleteFramebuffer(f); gl.deleteTexture(tex);
    drain(gl);
  }

  // C
  {
    const a=allocTexture(gl), b=allocTexture(gl);
    const f=makeFbo(gl);

    for(const t of [a,b]){
      gl.bindTexture(gl.TEXTURE_2D,t);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_BASE_LEVEL,1);
    }
    gl.bindTexture(gl.TEXTURE_2D,null);

    attach(gl,f,gl.COLOR_ATTACHMENT0,a,1);
    attach(gl,f,gl.COLOR_ATTACHMENT1,b,1);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0,gl.COLOR_ATTACHMENT1]);

    const s=status(gl);
    result(
      "C. two attachments / both level 1 / both BASE_LEVEL=1",
      s===gl.FRAMEBUFFER_COMPLETE,
      "status="+errorName(gl,s)
    );
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.deleteFramebuffer(f); gl.deleteTexture(a); gl.deleteTexture(b);
    drain(gl);
  }

  // D
  {
    const a=allocTexture(gl), b=allocTexture(gl);
    const f=makeFbo(gl);

    gl.bindTexture(gl.TEXTURE_2D,a);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_BASE_LEVEL,1);

    gl.bindTexture(gl.TEXTURE_2D,b);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_BASE_LEVEL,0);
    gl.bindTexture(gl.TEXTURE_2D,null);

    attach(gl,f,gl.COLOR_ATTACHMENT0,a,1);
    attach(gl,f,gl.COLOR_ATTACHMENT1,b,0);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0,gl.COLOR_ATTACHMENT1]);

    const s=status(gl);
    result(
      "D. mixed BASE_LEVEL / attachment levels",
      s===gl.FRAMEBUFFER_COMPLETE,
      "status="+errorName(gl,s)
    );
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.deleteFramebuffer(f); gl.deleteTexture(a); gl.deleteTexture(b);
    drain(gl);
  }

  // E
  {
    const srcTex=allocTexture(gl);
    const a=allocTexture(gl), b=allocTexture(gl);
    const src=makeFbo(gl), dst=makeFbo(gl);

    attach(gl,src,gl.COLOR_ATTACHMENT0,srcTex,1);

    for(const t of [a,b]){
      gl.bindTexture(gl.TEXTURE_2D,t);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_BASE_LEVEL,1);
    }
    gl.bindTexture(gl.TEXTURE_2D,null);

    attach(gl,dst,gl.COLOR_ATTACHMENT0,a,1);
    attach(gl,dst,gl.COLOR_ATTACHMENT1,b,1);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0,gl.COLOR_ATTACHMENT1]);

    const dstStatus=status(gl);
    const dstOK=dstStatus===gl.FRAMEBUFFER_COMPLETE;

    if(!dstOK){
      result(
        "E. multi-attachment + BASE_LEVEL + blit",
        false,
        "destination status="+errorName(gl,dstStatus)
      );
    }else{
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER,src);
      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,dst);

      drain(gl);
      let threw=false;
      try{
        for(let i=0;i<50;i++){
          gl.blitFramebuffer(
            0,0,32,32,
            0,0,32,32,
            gl.COLOR_BUFFER_BIT,
            gl.NEAREST
          );
        }
        gl.flush();
        gl.finish();
      }catch(e){
        threw=true;
        log("[FAIL] E exception: "+e);
      }

      const errors=drain(gl);
      result(
        "E. multi-attachment + BASE_LEVEL + blit",
        !threw && errors.length===0,
        errors.length ? errors.join(", ") : "no GL errors"
      );
    }

    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.deleteFramebuffer(src); gl.deleteFramebuffer(dst);
    gl.deleteTexture(srcTex); gl.deleteTexture(a); gl.deleteTexture(b);
    drain(gl);
  }
}

function run(){
  clear();

  const canvas=document.createElement("canvas");
  canvas.width=64; canvas.height=64;

  const gl=canvas.getContext("webgl2",{
    antialias:false,
    depth:false,
    stencil:false,
    preserveDrawingBuffer:false
  });

  if(!gl){
    log("[FAIL] WebGL2 unavailable");
    return;
  }

  log("Renderer: "+gl.getParameter(gl.RENDERER));
  log("Vendor:   "+gl.getParameter(gl.VENDOR));
  log("Version:  "+gl.getParameter(gl.VERSION));
  log("GLSL:     "+gl.getParameter(gl.SHADING_LANGUAGE_VERSION));
  log("");

  canvas.addEventListener("webglcontextlost",e=>{
    e.preventDefault();
    log("[!!!] WEBGL CONTEXT LOST");
  });
  canvas.addEventListener("webglcontextrestored",()=>{
    log("[!!!] WEBGL CONTEXT RESTORED");
  });

  try{
    runCases(gl);
  }catch(e){
    log("[!!!] Diagnostic aborted: "+(e.stack||e));
  }

  log("");
  log("=== SUMMARY ===");
  log(gl.isContextLost()
    ? "[!!!] WebGL context is LOST"
    : "[+] WebGL context remains active");
  log("A/B/C/D isolate framebuffer state; E reaches glBlitFramebuffer only if the destination FBO is complete.");
}

document.getElementById("run").addEventListener("click",run);
</script>
</body>
</html>
