<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mali / ANGLE WebGL2 Regression Harness v2</title>
<style>
body{background:#111;color:#eee;font:16px monospace;padding:18px;line-height:1.35}
button{font:inherit;padding:12px 18px;margin:6px 0 12px}
pre{white-space:pre-wrap;word-break:break-word}
.ok{color:#9f9}.bad{color:#f88}.warn{color:#fd8}
</style>
</head>
<body>
<h2>Mali / ANGLE WebGL2 regression harness v2</h2>
<p>Benign stability/regression test. No exploit code.</p>
<button id="run">Run all tests</button>
<pre id="out">Ready.</pre>

<script>
"use strict";

const out = document.getElementById("out");
const log = (...x) => {
  out.textContent += x.join(" ") + "\\n";
  console.log(...x);
};

function clearLog() { out.textContent = ""; }

function errName(gl, e) {
  const m = {
    0x0000:"NO_ERROR",
    0x0500:"INVALID_ENUM",
    0x0501:"INVALID_VALUE",
    0x0502:"INVALID_OPERATION",
    0x0503:"OUT_OF_MEMORY",
    0x0506:"INVALID_FRAMEBUFFER_OPERATION",
    0x9242:"CONTEXT_LOST_WEBGL"
  };
  return m[e] || ("0x" + e.toString(16));
}

function drainErrors(gl, label) {
  const errors = [];
  let e;
  while ((e = gl.getError()) !== gl.NO_ERROR) errors.push(errName(gl, e));
  if (errors.length) log("[!] " + label + ": " + errors.join(", "));
  return errors;
}

function makeTex(gl, w, h, levels) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST_MIPMAP_NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  let mw = w, mh = h;
  for (let level = 0; level < levels; level++) {
    gl.texImage2D(
      gl.TEXTURE_2D, level, gl.RGBA8,
      mw, mh, 0, gl.RGBA, gl.UNSIGNED_BYTE, null
    );
    mw = Math.max(1, mw >> 1);
    mh = Math.max(1, mh >> 1);
  }
  gl.bindTexture(gl.TEXTURE_2D, null);
  return t;
}

function makeCompleteFbo(gl, tex, level) {
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(
    gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0,
    gl.TEXTURE_2D, tex, level
  );
  return f;
}

function checkFbo(gl, label) {
  const s = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if (s !== gl.FRAMEBUFFER_COMPLETE) {
    log("[!] " + label + " status=" + errName(gl, s));
    return false;
  }
  return true;
}

function shader(gl, type, source) {
  const s = gl.createShader(type);
  gl.shaderSource(s, source);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error("shader compile failed: " + gl.getShaderInfoLog(s));
  }
  return s;
}

function simpleProgram(gl) {
  // IMPORTANT: actual newlines are used here, not literal "\\n".
  const vs = shader(gl, gl.VERTEX_SHADER, `#version 300 es
in vec2 p;
void main() {
  gl_Position = vec4(p, 0.0, 1.0);
}`);
  const fs = shader(gl, gl.FRAGMENT_SHADER, `#version 300 es
precision highp float;
out vec4 c;
void main() {
  c = vec4(0.25, 0.5, 0.75, 1.0);
}`);
  const p = gl.createProgram();
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.bindAttribLocation(p, 0, "p");
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    throw new Error("program link failed: " + gl.getProgramInfoLog(p));
  }
  gl.deleteShader(vs);
  gl.deleteShader(fs);
  return p;
}

function drawTiny(gl, program) {
  const b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
    -1,-1, 3,-1, -1,3
  ]), gl.STREAM_DRAW);
  gl.useProgram(program);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.disableVertexAttribArray(0);
  gl.bindBuffer(gl.ARRAY_BUFFER, null);
  gl.deleteBuffer(b);
}

function test1(gl) {
  log("\\n=== TEST 1: multi-attachment + valid nonzero BASE_LEVEL + blit ===");

  const srcTex = makeTex(gl, 64, 64, 4);
  const dstTex0 = makeTex(gl, 64, 64, 4);
  const dstTex1 = makeTex(gl, 64, 64, 4);

  const src = gl.createFramebuffer();
  const dst = gl.createFramebuffer();

  gl.bindFramebuffer(gl.FRAMEBUFFER, src);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0,
                          gl.TEXTURE_2D, srcTex, 0);
  if (!checkFbo(gl, "source FBO")) throw new Error("source FBO incomplete");

  gl.bindFramebuffer(gl.FRAMEBUFFER, dst);

  // Both attachments are valid and have the same dimensions.
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0,
                          gl.TEXTURE_2D, dstTex0, 0);

  gl.bindTexture(gl.TEXTURE_2D, dstTex1);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_BASE_LEVEL, 1);
  gl.bindTexture(gl.TEXTURE_2D, null);

  // Attach exactly the texture's base level.
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1,
                          gl.TEXTURE_2D, dstTex1, 1);

  gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);

  if (!checkFbo(gl, "destination FBO")) {
    throw new Error("destination FBO incomplete");
  }

  drainErrors(gl, "before blit");

  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, src);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, dst);

  for (let i = 0; i < 100; i++) {
    gl.blitFramebuffer(
      0, 0, 64, 64,
      0, 0, 64, 64,
      gl.COLOR_BUFFER_BIT,
      gl.NEAREST
    );
    if ((i & 15) === 15) gl.flush();
    if (gl.isContextLost()) throw new Error("context lost during Test 1");
  }

  gl.finish();
  const errors = drainErrors(gl, "after blit");
  log(errors.length ? "[!] Test 1 produced GL errors" :
                      "[+] Test 1 completed without GL errors");

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.deleteFramebuffer(src);
  gl.deleteFramebuffer(dst);
  gl.deleteTexture(srcTex);
  gl.deleteTexture(dstTex0);
  gl.deleteTexture(dstTex1);
}

function test2(gl, program) {
  log("\\n=== TEST 2: FBO lifetime + pending GPU work ===");

  // EXT_disjoint_timer_query_webgl2 is optional on Android.
  const qext = gl.getExtension("EXT_disjoint_timer_query_webgl2");
  log("timer query extension: " + (qext ? "available" : "unavailable"));

  for (let i = 0; i < 80; i++) {
    const tex = makeTex(gl, 32, 32, 1);
    const fbo = makeCompleteFbo(gl, tex, 0);

    if (!checkFbo(gl, "iteration " + i)) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.deleteFramebuffer(fbo);
      gl.deleteTexture(tex);
      throw new Error("FBO incomplete at iteration " + i);
    }

    gl.viewport(0, 0, 32, 32);
    gl.clearColor((i % 7) / 7, 0.25, 0.75, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    drawTiny(gl, program);

    let q = null;
    if (qext) {
      q = gl.createQuery();
      gl.beginQuery(qext.TIME_ELAPSED_EXT, q);
      drawTiny(gl, program);
      gl.endQuery(qext.TIME_ELAPSED_EXT);

      // Delete immediately while GPU work may still be pending.
      gl.deleteQuery(q);
      q = null;
    }

    // Unbind/delete FBO and texture while work has been queued.
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteFramebuffer(fbo);
    gl.deleteTexture(tex);

    if ((i & 7) === 7) {
      gl.flush();
      if (gl.isContextLost()) throw new Error("context lost at iteration " + i);
    }
  }

  gl.finish();
  const errors = drainErrors(gl, "after FBO lifetime test");
  log(errors.length ? "[!] Test 2 produced GL errors" :
                      "[+] Test 2 completed without GL errors");
}

function test3(gl) {
  log("\\n=== TEST 3: BASE_LEVEL changes + FBO reattachment/reallocation ===");

  const tex = makeTex(gl, 128, 128, 7);
  const fbo = gl.createFramebuffer();

  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0]);

  for (let round = 0; round < 100; round++) {
    const level = 1 + (round % 5);

    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_BASE_LEVEL, level);

    // Re-define the selected base mip level with the same dimensions it should have.
    const w = Math.max(1, 128 >> level);
    const h = Math.max(1, 128 >> level);
    gl.texImage2D(
      gl.TEXTURE_2D, level, gl.RGBA8,
      w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null
    );

    gl.framebufferTexture2D(
      gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0,
      gl.TEXTURE_2D, tex, level
    );

    if (!checkFbo(gl, "round " + round + " level " + level)) {
      throw new Error("FBO incomplete at level " + level);
    }

    gl.viewport(0, 0, w, h);
    gl.clearColor(0.1 * level, 0.2, 0.3, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    if ((round & 15) === 15) {
      gl.flush();
      if (gl.isContextLost()) throw new Error("context lost at round " + round);
    }
  }

  gl.finish();
  const errors = drainErrors(gl, "after BASE_LEVEL test");
  log(errors.length ? "[!] Test 3 produced GL errors" :
                      "[+] Test 3 completed without GL errors");

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.bindTexture(gl.TEXTURE_2D, null);
  gl.deleteFramebuffer(fbo);
  gl.deleteTexture(tex);
}

async function run() {
  clearLog();

  const canvas = document.createElement("canvas");
  canvas.width = 64;
  canvas.height = 64;

  const gl = canvas.getContext("webgl2", {
    antialias: false,
    depth: false,
    stencil: false,
    preserveDrawingBuffer: false
  });

  if (!gl) {
    log("[!] WebGL2 unavailable");
    return;
  }

  log("Renderer: " + gl.getParameter(gl.RENDERER));
  log("Vendor:   " + gl.getParameter(gl.VENDOR));
  log("Version:  " + gl.getParameter(gl.VERSION));
  log("GLSL:     " + gl.getParameter(gl.SHADING_LANGUAGE_VERSION));

  canvas.addEventListener("webglcontextlost", e => {
    e.preventDefault();
    log("[!!!] WEBGL CONTEXT LOST");
  });

  canvas.addEventListener("webglcontextrestored", () => {
    log("[!!!] WEBGL CONTEXT RESTORED");
  });

  const program = simpleProgram(gl);

  try {
    test1(gl);
    test2(gl, program);
    test3(gl);
  } catch (e) {
    log("\\n[!!!] TEST ABORTED: " + (e && e.stack ? e.stack : e));
  }

  gl.deleteProgram(program);

  log("\\n=== SUMMARY ===");
  if (gl.isContextLost()) {
    log("[!!!] WebGL context is LOST. Record this carefully.");
  } else {
    log("[+] Harness finished. No WebGL context loss observed.");
  }
  log("If Chrome/tab/GPU process crashes or restarts, record the exact test and time.");
}

document.getElementById("run").addEventListener("click", run);
</script>
</body>
</html>
