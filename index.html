<!doctype html>
<html>
<head><meta charset="utf-8"><title>tester</title></head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh">
  <button id="go" style="padding:16px 32px;font-size:18px">GO</button>
  <script>
    document.getElementById("go").onclick = function () {
      // 1) freeze renderer sejenak (efek "hang parah")
      const s = performance.now();
      while (performance.now() - s < 3000) Math.sqrt(performance.now());

      // 2) redirect ke target — omnibox pindah, demonstrasikan
      //    stale-paint / omnibox desync di sini
      location.href = "https://www.google.com";
    };
  </script>
</body>
</html>
