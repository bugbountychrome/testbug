<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chrome Android MediaStream lifecycle regression</title>
<style>
body{font:15px system-ui,sans-serif;padding:16px}
button{font-size:17px;padding:10px;margin:4px}
#log{white-space:pre-wrap;background:#eee;padding:10px;border-radius:8px}
</style>
<h3>MediaStream lifecycle race test</h3>
<button id="start">START</button>
<button id="stop">STOP</button>
<div id="log"></div>
<script>
const L=[];
const out=document.querySelector('#log');
function log(x){L.push(new Date().toISOString()+" "+x);out.textContent=L.slice(-80).join("\n");}

let stream=null, pc=null, running=false, timer=null, n=0;

async function cycle(){
  if(!running) return;
  try {
    // Repeatedly create native MediaStream/MediaStreamTrack objects,
    // attach callbacks, then tear them down while camera callbacks
    // may still be in flight.
    stream = await navigator.mediaDevices.getUserMedia({
      audio:true,
      video:{width:{ideal:640},height:{ideal:480},frameRate:{ideal:30}}
    });

    const tracks=[...stream.getTracks()];
    for(const t of tracks){
      t.onended=()=>log("track ended "+t.kind);
      t.onmute=()=>log("track mute "+t.kind);
      t.onunmute=()=>log("track unmute "+t.kind);
    }

    pc=new RTCPeerConnection();
    for(const t of tracks) pc.addTrack(t,stream);

    // Force negotiation/native WebRTC activity.
    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);

    // Teardown while native callbacks/tasks may still be queued.
    for(const t of tracks) t.stop();
    stream.getTracks().forEach(t=>{t.onended=null;t.onmute=null;t.onunmute=null});
    stream=null;

    pc.close();
    pc=null;

    n++;
    if(n%5===0) log("cycles="+n+" alive");
  } catch(e) {
    log("exception: "+e.name+" "+e.message);
    try{if(stream) stream.getTracks().forEach(t=>t.stop())}catch(_){}
    try{if(pc) pc.close()}catch(_){}
    stream=null; pc=null;
  }

  if(running) timer=setTimeout(cycle,0);
}

document.querySelector('#start').onclick=()=>{
  if(running)return;
  if(!navigator.mediaDevices?.getUserMedia){
    log("getUserMedia unavailable"); return;
  }
  running=true;n=0;log("START origin="+location.origin);
  cycle();
};

document.querySelector('#stop').onclick=()=>{
  running=false;
  clearTimeout(timer);
  try{if(stream)stream.getTracks().forEach(t=>t.stop())}catch(_){}
  try{if(pc)pc.close()}catch(_){}
  stream=null;pc=null;
  log("STOP cycles="+n);
};
</script>
