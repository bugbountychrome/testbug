<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mali FBO Query Flush Regression</title>
<style>
body{font-family:monospace;background:#111;color:#ddd;padding:16px}
button{display:block;width:100%;padding:14px;margin:10px 0;font:inherit}
pre{white-space:pre-wrap;word-break:break-word}
.ok{color:#8f8}.bad{color:#f88}
</style>
<h3>Mali FBO Query Flush Regression</h3>
<p>Bounded WebGL2 test for FBO unbind/delete while GPU queries are pending.</p>
<button id="a">A — query + unbind FBO</button>
<button id="b">B — query + delete FBO</button>
<button id="c">C — query + delete/recreate ×20</button>
<button id="d">D — query + FBO state churn ×20</button>
<pre id="log">Ready.</pre>

<script>
(() => {
"use strict";
const out=document.getElementById("log");
function log(s,cls){
  const x=document.createElement("div"); x.textContent=s;
  if(cls)x.className=cls; out.appendChild(x);
}
function reset(){out.textContent="";}

const canvas=document.createElement("canvas");
canvas.width=256; canvas.height=256;
document.body.appendChild(canvas);

const gl=canvas.getContext("webgl2",{antialias:false});
if(!gl){out.textContent="WebGL2 unavailable";return;}

const ext=gl.getExtension("EXT_disjoint_timer_query_webgl2");
log("Renderer: "+gl.getParameter(gl.RENDERER));
log("Version: "+gl.getParameter(gl.VERSION));
log("Query extension: "+(ext?"AVAILABLE":"UNAVAILABLE"));

let lost=false;
canvas.addEventListener("webglcontextlost",e=>{
  e.preventDefault(); lost=true; log("[CONTEXT LOST]","bad");
});
canvas.addEventListener("webglcontextrestored",()=>log("[CONTEXT RESTORED]"));

function err(label){
  const e=gl.getError();
  if(e!==gl.NO_ERROR){log("[FAIL] "+label+" GL error=0x"+e.toString(16),"bad");return false;}
  return true;
}

function makeTex(size=128){
  const t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,size,size,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.bindTexture(gl.TEXTURE_2D,null);
  return t;
}

function makeFbo(t){
  const f=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,
                          gl.TEXTURE_2D,t,0);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return f;
}

function render(f){
  gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.viewport(0,0,128,128);
  gl.clearColor(.17,.31,.49,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
}

function makeQuery(){
  if(!ext)return null;
  const q=gl.createQuery();
  gl.beginQuery(ext.TIME_ELAPSED_EXT,q);
  // Small bounded GPU workload.
  gl.clearColor(.23,.41,.67,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.endQuery(ext.TIME_ELAPSED_EXT);
  return q;
}

function poll(q){
  if(!q)return true;
  // Poll once; do not spin-wait.
  const available=gl.getQueryParameter(q,gl.QUERY_RESULT_AVAILABLE);
  const disjoint=gl.getParameter(ext.GPU_DISJOINT_EXT);
  return {available,disjoint};
}

function finishCheck(){
  const e=gl.getError();
  if(e!==gl.NO_ERROR){log("[FAIL] trailing GL error=0x"+e.toString(16),"bad");return false;}
  if(lost){log("[FAIL] context lost","bad");return false;}
  log("[PASS] no GL error / no context loss","ok");
  return true;
}

document.getElementById("a").onclick=()=>{
 reset(); log("=== TEST A: query + unbind FBO ===");
 if(!ext){log("[SKIP] EXT_disjoint_timer_query_webgl2 unavailable");return;}
 const t=makeTex(),f=makeFbo(t);
 render(f);
 const q=makeQuery();
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);
 const p=poll(q);
 log("query available="+p.available+" disjoint="+p.disjoint);
 gl.deleteQuery(q); gl.deleteFramebuffer(f); gl.deleteTexture(t);
 finishCheck();
};

document.getElementById("b").onclick=()=>{
 reset(); log("=== TEST B: query + delete FBO ===");
 if(!ext){log("[SKIP] EXT_disjoint_timer_query_webgl2 unavailable");return;}
 const t=makeTex(),f=makeFbo(t);
 render(f);
 const q=makeQuery();
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);
 gl.deleteFramebuffer(f);
 gl.deleteTexture(t);
 const p=poll(q);
 log("query available="+p.available+" disjoint="+p.disjoint);
 gl.deleteQuery(q);
 finishCheck();
};

document.getElementById("c").onclick=()=>{
 reset(); log("=== TEST C: query + delete/recreate ×20 ===");
 if(!ext){log("[SKIP] EXT_disjoint_timer_query_webgl2 unavailable");return;}
 for(let i=1;i<=20;i++){
   const t=makeTex(),f=makeFbo(t);
   render(f);
   const q=makeQuery();
   gl.bindFramebuffer(gl.FRAMEBUFFER,null);
   gl.deleteFramebuffer(f);
   gl.deleteTexture(t);
   const p=poll(q);
   if(i===1||i===20)log("cycle "+i+" available="+p.available+" disjoint="+p.disjoint);
   gl.deleteQuery(q);
   if(lost)break;
 }
 finishCheck();
};

document.getElementById("d").onclick=()=>{
 reset(); log("=== TEST D: query + FBO state churn ×20 ===");
 if(!ext){log("[SKIP] EXT_disjoint_timer_query_webgl2 unavailable");return;}
 for(let i=1;i<=20;i++){
   const t0=makeTex(),t1=makeTex();
   const f=makeFbo(t0);
   render(f);
   const q=makeQuery();

   // Unbind/delete while query work may still be pending.
   gl.bindFramebuffer(gl.FRAMEBUFFER,null);
   gl.deleteFramebuffer(f);
   gl.deleteTexture(t0);

   // Rebind a fresh FBO and continue normal work.
   const f2=makeFbo(t1);
   render(f2);
   gl.bindFramebuffer(gl.FRAMEBUFFER,null);

   const p=poll(q);
   if(i===1||i===20)log("cycle "+i+" available="+p.available+" disjoint="+p.disjoint);
   gl.deleteQuery(q);
   gl.deleteFramebuffer(f2);
   gl.deleteTexture(t1);
   if(lost)break;
 }
 finishCheck();
};
})();
</script>
