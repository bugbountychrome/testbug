<!doctype html>
<meta name="viewport" content="width=device-width">
<button onclick="start()">START CAMERA + MIC</button>
<pre id="log"></pre>

<script>
const log = x => {
  document.querySelector("#log").textContent +=
    new Date().toISOString() + "  " + x + "\n";
};

async function start() {
  try {
    const s = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    log("STREAM STARTED");

    for (const t of s.getTracks()) {
      log(`${t.kind}: ${t.readyState}, enabled=${t.enabled}`);
      t.onended = () => log(`${t.kind}: ENDED`);
      t.onmute = () => log(`${t.kind}: MUTED`);
      t.onunmute = () => log(`${t.kind}: UNMUTED`);
    }

    setInterval(() => {
      log(
        `visibility=${document.visibilityState} ` +
        `video=${s.getVideoTracks()[0]?.readyState} ` +
        `audio=${s.getAudioTracks()[0]?.readyState}`
      );
    }, 1000);

  } catch (e) {
    log(`ERROR ${e.name}: ${e.message}`);
  }
}
</script>
