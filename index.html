<!doctype html>
<meta name="viewport" content="width=device-width">

<button onclick="test()">TEST FILE SYSTEM ACCESS</button>
<pre id="log"></pre>

<script>
const log = x =>
  document.querySelector("#log").textContent += x + "\n";

async function test() {
  log("origin = " + location.origin);

  if (!window.showOpenFilePicker) {
    log("showOpenFilePicker: NOT SUPPORTED");
    return;
  }

  log("showOpenFilePicker: SUPPORTED");

  try {
    const handles = await showOpenFilePicker({
      multiple: false
    });

    log("PICKER RETURNED");
    log("handles = " + handles.length);

  } catch (e) {
    log("ERROR: " + e.name);
    log(e.message);
  }
}
</script>
