<!doctype html>
<meta name="viewport" content="width=device-width">
<h2>LNA Public → LAN Test</h2>
<button id="test">FETCH LAN SERVICE</button>
<pre id="out">waiting...</pre>

<script>
document.getElementById('test').onclick = async () => {
  const out = document.getElementById('out');
  out.textContent = 'requesting...';

  try {
    const r = await fetch('http://192.168.1.3:9001/secret', {
  targetAddressSpace: 'local'
});
    const text = await r.text();

    out.textContent =
      `SUCCESS\nHTTP: ${r.status}\nDATA: ${text}`;
  } catch (e) {
    out.textContent = `BLOCKED / ERROR\n${e.name}: ${e.message}`;
  }
};
</script>
