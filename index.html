<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width">
  <title>WebGL Android GPU Test</title>
</head>

<body>

<button onclick="runTest()">RUN WEBGL TEST</button>

<pre id="log"></pre>

<script>
function log(x) {
  document.getElementById("log").textContent += x + "\n";
}

function runTest() {
  document.getElementById("log").textContent = "";

  const canvas = document.createElement("canvas");

  const gl = canvas.getContext("webgl2", {
    antialias: false
  });

  if (!gl) {
    log("WebGL2: NOT SUPPORTED");
    return;
  }

  log("WebGL2: SUPPORTED");

  const debug = gl.getExtension("WEBGL_debug_renderer_info");

  if (debug) {
    log(
      "Vendor: " +
      gl.getParameter(debug.UNMASKED_VENDOR_WEBGL)
    );

    log(
      "Renderer: " +
      gl.getParameter(debug.UNMASKED_RENDERER_WEBGL)
    );
  }

  let lost = false;

  canvas.addEventListener("webglcontextlost", function(e) {
    e.preventDefault();
    lost = true;
    log("CONTEXT LOST");
  });

  canvas.addEventListener("webglcontextrestored", function() {
    log("CONTEXT RESTORED");
  });

  // NPOT immutable texture
  const tex = gl.createTexture();

  gl.bindTexture(gl.TEXTURE_2D, tex);

  const width = 257;
  const height = 193;

  gl.texStorage2D(
    gl.TEXTURE_2D,
    8,
    gl.RGBA8,
    width,
    height
  );

  log("Immutable NPOT texture: CREATED");

  gl.texParameteri(
    gl.TEXTURE_2D,
    gl.TEXTURE_BASE_LEVEL,
    0
  );

  log("BASE_LEVEL = 0");

  gl.getError();

  // Trigger the affected state transition
  gl.texParameteri(
    gl.TEXTURE_2D,
    gl.TEXTURE_BASE_LEVEL,
    1
  );

  const err = gl.getError();

  log("BASE_LEVEL = 1");
  log("gl.getError() = " + err);

  if (err === gl.NO_ERROR) {
    log("BASE_LEVEL CHANGE ACCEPTED");
  }

  // Give the GPU command queue time to process
  setTimeout(() => {

    log("");
    log("=== RESULT ===");

    if (lost) {
      log("Context was lost.");
    } else {
      log("Context still alive.");
    }

    log("TEST COMPLETE");

  }, 1500);
}
</script>

</body>
</html>
