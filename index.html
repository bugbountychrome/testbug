<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANGLE Indexed Draw / Primitive Restart v2</title>
<pre id=o>starting...</pre>
<script>
const o=document.getElementById("o");
const log=s=>o.textContent+=s+"\n";
function err(gl,label){
  const e=gl.getError();
  log(label+": "+(e===gl.NO_ERROR?"NO_ERROR":"0x"+e.toString(16)));
  return e;
}
function makeGL(){
  const c=document.createElement("canvas"); c.width=c.height=64;
  return c.getContext("webgl2",{antialias:false,preserveDrawingBuffer:true});
}
function program(gl){
 const vs=gl.createShader(gl.VERTEX_SHADER);
 gl.shaderSource(vs,`#version 300 es
 layout(location=0) in vec2 p;
 void main(){gl_Position=vec4(p,0.0,1.0);gl_PointSize=1.0;}`);
 gl.compileShader(vs);
 const fs=gl.createShader(gl.FRAGMENT_SHADER);
 gl.shaderSource(fs,`#version 300 es
 precision highp float;
 out vec4 c;
 void main(){c=vec4(1.0,0.0,0.0,1.0);}`);
 gl.compileShader(fs);
 const p=gl.createProgram();gl.attachShader(p,vs);gl.attachShader(p,fs);gl.linkProgram(p);
 return p;
}
function positions(gl,count,special){
 const a=new Float32Array(count*2);
 for(let i=0;i<count;i++){a[i*2]=2.5;a[i*2+1]=2.5;}
 for(const [id,x,y] of special){
   a[id*2]=2*x/64-1+1/64;
   a[id*2+1]=2*y/64-1+1/64;
 }
 const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
 gl.bufferData(gl.ARRAY_BUFFER,a,gl.STATIC_DRAW);
 gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
 return b;
}
function pixels(gl){
 const a=new Uint8Array(64*64*4);gl.readPixels(0,0,64,64,gl.RGBA,gl.UNSIGNED_BYTE,a);
 let n=0;for(let i=0;i<a.length;i+=4)if(a[i]===255&&a[i+1]===0&&a[i+2]===0&&a[i+3]===255)n++;
 return n;
}
function clear(gl){gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);}
function run(name,fn,gl){
 try{
   while(gl.getError()!==gl.NO_ERROR){}
   fn();
   const e=gl.getError();
   log(name+": "+(e===gl.NO_ERROR?"PASS":"GL_ERROR 0x"+e.toString(16)));
 }catch(e){log(name+": EXCEPTION "+e);}
}

/*
 WebGL2 primitive restart is controlled by the WebGL2 fixed-index state.
 The enum is exposed as gl.PRIMITIVE_RESTART_FIXED_INDEX, but this test
 deliberately checks the enum before use and reports the exact operation
 that fails. No invalid index access is generated.
*/
const gl=makeGL();
if(!gl){log("NO WEBGL2");}
else{
 log("WebGL2 OK");
 log("PRIMITIVE_RESTART_FIXED_INDEX="+gl.PRIMITIVE_RESTART_FIXED_INDEX);
 log("UNSIGNED_BYTE="+gl.UNSIGNED_BYTE+" UNSIGNED_SHORT="+gl.UNSIGNED_SHORT);
 const p=program(gl);gl.useProgram(p);err(gl,"useProgram");

 // UBYTE: vertices 0, 1, 254, 255 are all allocated.
 const vb=positions(gl,256,[[0,8,8],[1,16,8],[254,24,8],[255,32,8]]);
 const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);err(gl,"setup UBYTE");
 run("A UBYTE restart OFF -> ON",()=>{
   clear(gl);
   gl.disable(gl.PRIMITIVE_RESTART_FIXED_INDEX);err(gl,"A1 disable");
   gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint8Array([0,1,254,255]),gl.STATIC_DRAW);err(gl,"A2 buffer");
   gl.drawElements(gl.POINTS,4,gl.UNSIGNED_BYTE,0);err(gl,"A3 draw off");
   const off=pixels(gl);log("A off redPixels="+off);
   clear(gl);
   gl.enable(gl.PRIMITIVE_RESTART_FIXED_INDEX);err(gl,"A4 enable");
   gl.drawElements(gl.POINTS,4,gl.UNSIGNED_BYTE,0);err(gl,"A5 draw on");
   const on=pixels(gl);log("A on redPixels="+on);
   if(off!==4||on!==3)throw Error("oracle mismatch");
   gl.disable(gl.PRIMITIVE_RESTART_FIXED_INDEX);
 },gl);

 // USHORT: 65534 valid, 65535 is fixed restart.
 const vb2=positions(gl,65536,[[0,8,24],[1,16,24],[65534,24,24],[65535,32,24]]);
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
 run("B USHORT restart OFF -> ON",()=>{
   clear(gl);
   gl.disable(gl.PRIMITIVE_RESTART_FIXED_INDEX);
   gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array([0,1,65534,65535]),gl.STATIC_DRAW);
   gl.drawElements(gl.POINTS,4,gl.UNSIGNED_SHORT,0);
   const off=pixels(gl);log("B off redPixels="+off);
   clear(gl);
   gl.enable(gl.PRIMITIVE_RESTART_FIXED_INDEX);
   gl.drawElements(gl.POINTS,4,gl.UNSIGNED_SHORT,0);
   const on=pixels(gl);log("B on redPixels="+on);
   if(off!==4||on!==3)throw Error("oracle mismatch");
   gl.disable(gl.PRIMITIVE_RESTART_FIXED_INDEX);
 },gl);

 // Offset test: restart occurs in the middle of a valid index sequence.
 run("C USHORT restart + aligned offset",()=>{
   clear(gl);
   gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
   gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array([0,1,2,65535,3,4]),gl.STATIC_DRAW);
   gl.enable(gl.PRIMITIVE_RESTART_FIXED_INDEX);
   gl.drawElements(gl.POINTS,5,gl.UNSIGNED_SHORT,2);
   const n=pixels(gl);log("C redPixels="+n);
   if(n!==4)throw Error("oracle mismatch");
   gl.disable(gl.PRIMITIVE_RESTART_FIXED_INDEX);
 },gl);

 // Resize/rewrite the same ELEMENT_ARRAY_BUFFER while the VAO state remains active.
 run("D index-buffer resize/rewrite",()=>{
   clear(gl);
   gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
   gl.disable(gl.PRIMITIVE_RESTART_FIXED_INDEX);
   gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array([0,1,2]),gl.DYNAMIC_DRAW);
   gl.drawElements(gl.POINTS,3,gl.UNSIGNED_SHORT,0);
   const first=pixels(gl);log("D first redPixels="+first);
   clear(gl);
   gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,64,gl.DYNAMIC_DRAW);
   gl.bufferSubData(gl.ELEMENT_ARRAY_BUFFER,0,new Uint16Array([0,1,2,3,4,5]));
   gl.drawElements(gl.POINTS,6,gl.UNSIGNED_SHORT,0);
   const second=pixels(gl);log("D second redPixels="+second);
   if(first!==3||second!==6)throw Error("oracle mismatch");
 },gl);

 log("DONE");
}
</script>
