<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebGL2 Texture Array Grow / FBO Regression v1</title>
<style>
body{font-family:monospace;background:#111;color:#ddd;padding:16px}
button{display:block;width:100%;padding:14px;margin:10px 0;font:inherit}
pre{white-space:pre-wrap;word-break:break-word}
.ok{color:#8f8}.bad{color:#f88}
</style>
<h3>Texture Array Grow / FBO Regression</h3>
<p>Bounded WebGL2 regression tests for texture-array reallocation while FBO state is reused.</p>
<button id="a">A — grow array while FBO attached</button>
<button id="b">B — grow + switch layer + reuse FBO</button>
<button id="c">C — grow 2→4→8→16 layers</button>
<button id="d">D — bounded grow/rebind ×20</button>
<pre id="log">Ready.</pre>

<script>
(() => {
"use strict";
const out=document.getElementById("log");
function reset(){out.textContent="";}
function log(s,cls){
  const x=document.createElement("div"); x.textContent=s;
  if(cls)x.className=cls; out.appendChild(x);
}

const canvas=document.createElement("canvas");
canvas.width=256; canvas.height=256;
document.body.appendChild(canvas);
const gl=canvas.getContext("webgl2",{antialias:false});
if(!gl){out.textContent="WebGL2 unavailable";return;}

log("Renderer: "+gl.getParameter(gl.RENDERER));
log("Version: "+gl.getParameter(gl.VERSION));
log("MAX_ARRAY_TEXTURE_LAYERS="+
    gl.getParameter(gl.MAX_ARRAY_TEXTURE_LAYERS));

let lost=false;
canvas.addEventListener("webglcontextlost",e=>{
  e.preventDefault(); lost=true; log("[CONTEXT LOST]","bad");
});
canvas.addEventListener("webglcontextrestored",()=>log("[CONTEXT RESTORED]"));

function check(label){
  const e=gl.getError();
  if(e!==gl.NO_ERROR){
    log("[FAIL] "+label+" GL error=0x"+e.toString(16),"bad");
    return false;
  }
  if(lost){log("[FAIL] context lost","bad");return false;}
  return true;
}

function finish(){
  const e=gl.getError();
  if(e!==gl.NO_ERROR){
    log("[FAIL] trailing GL error=0x"+e.toString(16),"bad"); return;
  }
  if(lost){log("[FAIL] context lost","bad");return;}
  log("[PASS] no GL error / no context loss","ok");
}

function makeArray(layers){
  const t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D_ARRAY,t);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texImage3D(
    gl.TEXTURE_2D_ARRAY,0,gl.RGBA8,
    64,64,layers,0,
    gl.RGBA,gl.UNSIGNED_BYTE,null
  );
  gl.bindTexture(gl.TEXTURE_2D_ARRAY,null);
  return t;
}

function makeFbo(t,layer=0){
  const f=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTextureLayer(
    gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,t,0,layer
  );
  gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
  const s=gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if(s!==gl.FRAMEBUFFER_COMPLETE)
    log("[FAIL] FBO status=0x"+s.toString(16),"bad");
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return f;
}

function renderColor(r,g,b){
  gl.viewport(0,0,64,64);
  gl.clearColor(r,g,b,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
}

function pixel(){
  const p=new Uint8Array(4);
  gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,p);
  return "["+[...p].join(",")+"]";
}

function bindRender(f){
  gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  renderColor(.2,.4,.7);
}

/*
 * A: The important state transition:
 * array is attached to FBO -> FBO remains bound -> array storage grows.
 * This is intentionally small and bounded.
 */
document.getElementById("a").onclick=()=>{
  reset(); log("=== TEST A: grow array while FBO attached ===");

  const t=makeArray(2);
  const f=makeFbo(t,0);

  bindRender(f);
  log("before grow pixel="+pixel());

  // Grow while the texture remains attached to the currently bound FBO.
  gl.bindTexture(gl.TEXTURE_2D_ARRAY,t);
  gl.texImage3D(
    gl.TEXTURE_2D_ARRAY,0,gl.RGBA8,
    64,64,4,0,gl.RGBA,gl.UNSIGNED_BYTE,null
  );
  gl.bindTexture(gl.TEXTURE_2D_ARRAY,null);

  // Reuse the same FBO after growth.
  gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  renderColor(.8,.2,.1);
  log("after grow pixel="+pixel());
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);

  gl.deleteFramebuffer(f);
  gl.deleteTexture(t);
  finish();
};

/*
 * B: grow then explicitly switch the attached layer and render again.
 */
document.getElementById("b").onclick=()=>{
  reset(); log("=== TEST B: grow + switch layer + reuse FBO ===");

  const t=makeArray(2);
  const f=makeFbo(t,0);

  gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  renderColor(.1,.3,.8);

  gl.bindTexture(gl.TEXTURE_2D_ARRAY,t);
  gl.texImage3D(
    gl.TEXTURE_2D_ARRAY,0,gl.RGBA8,
    64,64,8,0,gl.RGBA,gl.UNSIGNED_BYTE,null
  );
  gl.bindTexture(gl.TEXTURE_2D_ARRAY,null);

  // Reattach to a newly-created layer after the grow.
  gl.framebufferTextureLayer(
    gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,t,0,7
  );
  const s=gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  log("layer7 FBO status=0x"+s.toString(16));

  renderColor(.7,.1,.5);
  log("layer7 pixel="+pixel());

  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.deleteFramebuffer(f); gl.deleteTexture(t);
  finish();
};

/*
 * C: repeated increasing layer counts while FBO is attached.
 */
document.getElementById("c").onclick=()=>{
  reset(); log("=== TEST C: grow 2→4→8→16 layers ===");

  const t=makeArray(2);
  const f=makeFbo(t,0);

  const sizes=[4,8,16];
  for(let i=0;i<sizes.length;i++){
    gl.bindFramebuffer(gl.FRAMEBUFFER,f);

    gl.bindTexture(gl.TEXTURE_2D_ARRAY,t);
    gl.texImage3D(
      gl.TEXTURE_2D_ARRAY,0,gl.RGBA8,
      64,64,sizes[i],0,
      gl.RGBA,gl.UNSIGNED_BYTE,null
    );
    gl.bindTexture(gl.TEXTURE_2D_ARRAY,null);

    renderColor(
      (i+1)/4,
      .2,
      .8-(i/5)
    );

    const s=gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    log("layers="+sizes[i]+" status=0x"+s.toString(16)+
        " pixel="+pixel());

    if(s!==gl.FRAMEBUFFER_COMPLETE)break;
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.deleteFramebuffer(f); gl.deleteTexture(t);
  finish();
};

/*
 * D: bounded repeated attach -> render -> grow -> reattach -> render.
 * Only 20 iterations, small 64x64 storage.
 */
document.getElementById("d").onclick=()=>{
  reset(); log("=== TEST D: bounded grow/rebind ×20 ===");

  const t=makeArray(2);
  const f=makeFbo(t,0);

  for(let i=1;i<=20;i++){
    const layers=2+(i%7);

    gl.bindFramebuffer(gl.FRAMEBUFFER,f);
    gl.framebufferTextureLayer(
      gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,t,0,i%2
    );
    renderColor(.1+(i%5)/10,.2,.3);

    gl.bindTexture(gl.TEXTURE_2D_ARRAY,t);
    gl.texImage3D(
      gl.TEXTURE_2D_ARRAY,0,gl.RGBA8,
      64,64,layers,0,
      gl.RGBA,gl.UNSIGNED_BYTE,null
    );
    gl.bindTexture(gl.TEXTURE_2D_ARRAY,null);

    // Reattach a guaranteed-valid layer in the new storage.
    gl.framebufferTextureLayer(
      gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,t,0,layers-1
    );

    const s=gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    renderColor(.6,.2+(i%3)/10,.1);
    const p=pixel();

    if(i===1||i===20)
      log("cycle "+i+" layers="+layers+
          " status=0x"+s.toString(16)+" pixel="+p);

    if(s!==gl.FRAMEBUFFER_COMPLETE)break;
    if(lost)break;
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.deleteFramebuffer(f); gl.deleteTexture(t);
  finish();
};
})();
</script>
