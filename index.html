<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Opera Mini Permission Boundary Test</title>
</head>
<body>
  <h2>Permission Boundary Test</h2>
  <p>Checks camera and microphone permission handling.</p>
  <pre id="result">Starting test...</pre>

  <script>
    const out = document.getElementById('result');

    async function test() {
      out.textContent =
        'Secure context: ' + window.isSecureContext +
        '\ngetUserMedia available: ' +
        !!(navigator.mediaDevices &&
           navigator.mediaDevices.getUserMedia) +
        '\nRequesting permission...';

      if (!navigator.mediaDevices?.getUserMedia) {
        out.textContent +=
          '\nUNAVAILABLE: getUserMedia is not supported here.';
        return;
      }

      try {
        const stream =
          await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: true
          });

        out.textContent +=
          '\nRESULT: STREAM GRANTED' +
          '\nTracks: ' +
          stream.getTracks().map(t =>
            t.kind + '=' + t.readyState
          ).join(', ');

        stream.getTracks().forEach(t => t.stop());
        out.textContent += '\nAll tracks stopped immediately.';
      } catch (e) {
        out.textContent +=
          '\nRESULT: ' + e.name +
          '\nDetails: ' + e.message;
      }
    }

    test();
  </script>
</body>
</html>
