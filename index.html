<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mali PACK_ROW_LENGTH Boundary v2</title>
<style>
body{font:14px monospace;background:#111;color:#ddd;padding:12px}
button{display:block;width:100%;margin:7px 0;padding:12px}
.ok{color:#8f8}.bad{color:#f88}.info{color:#8cf}
</style>
<h3>Mali PACK_ROW_LENGTH Boundary v2</h3>
<div id="info"></div>
<button onclick="run(1)">TEST 1 — boundary - 1</button>
<button onclick="run(2)">TEST 2 — exact boundary</button>
<button onclick="run(3)">TEST 3 — boundary + 1 + SKIP_ROWS</button>
<button onclick="run(4)">TEST 4 — boundary + 1 + clipped readPixels</button>
<button onclick="all()">RUN ALL</button>
<pre id="out"></pre>
<script>
"use strict";

const LIMIT = 0x10000000;       // 268,435,456 bytes
const BPP = 4;                  // RGBA8
const ROW0 = 67108864;          // LIMIT / 4
const W = 4, H = 4;
let seq = 0;

function log(s, cls="") {
  const p=document.createElement("div");
  p.textContent=s; if(cls)p.className=cls;
  out.appendChild(p);
}
function fresh() {
  const c=document.createElement("canvas");
  c.width=W;c.height=H;
  const gl=c.getContext("webgl2",{antialias:false,preserveDrawingBuffer:true});
  if(!gl) throw Error("WebGL2 unavailable");
  return {c,gl};
}
function errName(gl,e) {
  return e===gl.NO_ERROR ? "NO_ERROR" :
         e===gl.INVALID_ENUM ? "INVALID_ENUM" :
         e===gl.INVALID_VALUE ? "INVALID_VALUE" :
         e===gl.INVALID_OPERATION ? "INVALID_OPERATION" :
         e===gl.OUT_OF_MEMORY ? "OUT_OF_MEMORY" :
         "0x"+e.toString(16);
}
function setup(gl) {
  gl.viewport(0,0,W,H);
  gl.clearColor(0.125,0.25,0.5,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.finish();
  while(gl.getError()!==gl.NO_ERROR){}
}
function run(n) {
  seq++;
  out.textContent="";
  log("TEST "+n+" / fresh WebGL2 context","info");
  let gl,c,pbo;
  try {
    ({c,gl}=fresh());
    setup(gl);

    pbo=gl.createBuffer();
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER,pbo);

    // Allocate only the small destination region actually needed by
    // readPixels. This keeps the harness bounded; PACK_ROW_LENGTH is
    // deliberately much larger than the framebuffer width.
    const dstBytes = 256;
    gl.bufferData(gl.PIXEL_PACK_BUFFER,dstBytes,gl.STREAM_READ);
    let e=gl.getError();
    if(e!==gl.NO_ERROR) throw Error("bufferData: "+errName(gl,e));

    let rowLength, skipRows=0, x=0, y=0, rw=W, rh=H;
    if(n===1) {
      rowLength=ROW0-1;
    } else if(n===2) {
      rowLength=ROW0;
    } else if(n===3) {
      rowLength=ROW0+1;
      skipRows=1;
    } else {
      rowLength=ROW0+1;
      // Clipped read: only a 2x2 region at the framebuffer edge.
      x=2; y=2; rw=2; rh=2;
    }

    gl.pixelStorei(gl.PACK_ROW_LENGTH,rowLength);
    gl.pixelStorei(gl.PACK_SKIP_ROWS,skipRows);
    gl.pixelStorei(gl.PACK_SKIP_PIXELS,0);
    e=gl.getError();
    if(e!==gl.NO_ERROR) {
      log("pixelStore error: "+errName(gl,e),"bad");
      return;
    }

    const beforeLoss=gl.isContextLost();
    log("ROW_LENGTH="+rowLength+" ("+(rowLength*BPP).toString()+" bytes/row)");
    log("SKIP_ROWS="+skipRows+" read="+rw+"x"+rh);

    // Offset 0. We intentionally do not attempt to allocate the enormous
    // logical PACK layout; the test probes ANGLE's validation/row-by-row path.
    gl.readPixels(x,y,rw,rh,gl.RGBA,gl.UNSIGNED_BYTE,0);
    e=gl.getError();
    const lost=gl.isContextLost();

    log("getError="+errName(gl,e));
    log("contextLost="+lost);

    // If the command was accepted, force completion and inspect only the
    // bounded first 16 bytes. No huge client allocation or readback.
    if(e===gl.NO_ERROR && !lost) {
      gl.finish();
      const view=new Uint8Array(16);
      gl.getBufferSubData(gl.PIXEL_PACK_BUFFER,0,view);
      const e2=gl.getError();
      log("getBufferSubData="+errName(gl,e2));
      log("first16="+Array.from(view).join(","));
    }

    if(gl.isContextLost()) {
      log("SECURITY SIGNAL: unexpected WebGL context loss","bad");
    } else {
      log("PASS: no context loss","ok");
    }
  } catch(ex) {
    log("EXCEPTION: "+ex.message,"bad");
  } finally {
    try {
      if(gl) {
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER,null);
        if(pbo) gl.deleteBuffer(pbo);
      }
    } catch(_){}
  }
}

async function all() {
  out.textContent="";
  for(let i=1;i<=4;i++){
    run(i);
    await new Promise(r=>setTimeout(r,250));
  }
}
try {
  const t=fresh();
  info.textContent =
    "WebGL2: "+!!t.gl+
    " | renderer="+t.gl.getParameter(t.gl.RENDERER)+
    " | version="+t.gl.getParameter(t.gl.VERSION)+
    " | LIMIT="+LIMIT;
} catch(e) {
  info.textContent="WebGL2 unavailable: "+e.message;
}
</script>
