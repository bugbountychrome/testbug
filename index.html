<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chrome Android Mali WebGL2 regression harness</title>
<style>
body{font-family:monospace;background:#111;color:#eee;padding:16px}
button{font-size:16px;padding:10px;margin:4px 0}
pre{white-space:pre-wrap;word-break:break-word}
.ok{color:#8f8}.warn{color:#fc6}
</style>
<h2>Mali / ANGLE WebGL2 regression harness</h2>
<p>This is a benign stability/regression test. It does not attempt to exploit a known Chromium bug.</p>
<button id="run">Run all tests</button>
<pre id="log"></pre>
<script>
"use strict";
const out=document.getElementById("log");
function log(s){out.textContent += s+"\\n"; console.log(s);}
function fail(s){log("[!] "+s);}
function ok(s){log("[+] "+s);}

function makeGL(){
  const c=document.createElement("canvas");
  c.width=512;c.height=512;
  document.body.appendChild(c);
  const gl=c.getContext("webgl2",{antialias:false,preserveDrawingBuffer:false});
  if(!gl) throw new Error("WebGL2 unavailable");
  log("Renderer: "+gl.getParameter(gl.RENDERER));
  log("Vendor:   "+gl.getParameter(gl.VENDOR));
  log("Version:  "+gl.getParameter(gl.VERSION));
  return {gl,c};
}

function shader(gl,type,src){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(gl){
  const vs=shader(gl,gl.VERTEX_SHADER,
    "#version 300 es\\n"+
    "in vec2 p; void main(){gl_Position=vec4(p,0.,1.);}");
  const fs=shader(gl,gl.FRAGMENT_SHADER,
    "#version 300 es\\nprecision highp float; uniform vec4 u; out vec4 o;"+
    "void main(){o=u;}");
  const p=gl.createProgram(); gl.attachShader(p,vs);gl.attachShader(p,fs);
  gl.bindAttribLocation(p,0,"p");gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

function makeTex(gl,w,h,level=0){
  const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_BASE_LEVEL,level);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAX_LEVEL,Math.max(level,4));
  gl.texStorage2D(gl.TEXTURE_2D,5,gl.RGBA8,w,h);
  gl.bindTexture(gl.TEXTURE_2D,null); return t;
}

function testMultiAttachmentBlit(gl){
  log("\\n=== TEST 1: multi-attachment + nonzero BASE_LEVEL + blit ===");
  const src=gl.createFramebuffer(), dst=gl.createFramebuffer();
  const ts=[], rs=[];
  gl.bindFramebuffer(gl.FRAMEBUFFER,src);
  const st=makeTex(gl,128,128,0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,st,0);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0]);

  gl.bindFramebuffer(gl.FRAMEBUFFER,dst);
  for(let i=0;i<2;i++){
    const t=makeTex(gl,128,128,i?1:0);
    ts.push(t);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0+i,gl.TEXTURE_2D,t,i?1:0);
  }
  gl.drawBuffers([gl.COLOR_ATTACHMENT0,gl.COLOR_ATTACHMENT1]);
  let status=gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  log("dst status=0x"+status.toString(16));
  if(status!==gl.FRAMEBUFFER_COMPLETE){fail("destination FBO incomplete");return false;}

  gl.bindFramebuffer(gl.READ_FRAMEBUFFER,src);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,dst);
  for(let i=0;i<100;i++){
    gl.blitFramebuffer(0,0,128,128,0,0,128,128,gl.COLOR_BUFFER_BIT,gl.NEAREST);
  }
  gl.finish();
  const e=gl.getError(); log("glError=0x"+e.toString(16));
  gl.deleteFramebuffer(src);gl.deleteFramebuffer(dst);
  ts.forEach(t=>gl.deleteTexture(t));
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  ok("multi-attachment blit completed");
  return e===gl.NO_ERROR;
}

function testFboQueryLifetime(gl){
  log("\\n=== TEST 2: pending query + FBO lifetime ===");
  const ext=gl.getExtension("EXT_disjoint_timer_query_webgl2");
  if(!ext){log("timer query extension unavailable; skipping query portion");}
  const p=program(gl);
  const v=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,v);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const fbs=[];
  for(let n=0;n<80;n++){
    const f=gl.createFramebuffer(), t=makeTex(gl,256,256,0);
    gl.bindFramebuffer(gl.FRAMEBUFFER,f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
    gl.useProgram(p);gl.bindBuffer(gl.ARRAY_BUFFER,v);
    gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
    gl.viewport(0,0,256,256);
    gl.uniform4f(gl.getUniformLocation(p,"u"),Math.random(),0.25,0.75,1);
    if(ext){
      const q=gl.createQuery();
      gl.beginQuery(ext.TIME_ELAPSED_EXT,q);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
      gl.endQuery(ext.TIME_ELAPSED_EXT);
      gl.deleteQuery(q);
    }else{
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    }
    // Delete immediately after submitting GPU work.
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.deleteFramebuffer(f);gl.deleteTexture(t);
    if((n&15)===15) gl.flush();
  }
  gl.finish();
  const e=gl.getError(); log("glError=0x"+e.toString(16));
  ok("FBO/query lifetime sequence completed");
  return e===gl.NO_ERROR;
}

function testBaseLevelReallocation(gl){
  log("\\n=== TEST 3: BASE_LEVEL + FBO attachment + reallocation ===");
  const f=gl.createFramebuffer(), t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST_MIPMAP_NEAREST);
  gl.texStorage2D(gl.TEXTURE_2D,6,gl.RGBA8,256,256);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_BASE_LEVEL,2);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAX_LEVEL,5);
  gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,2);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
  for(let i=0;i<100;i++){
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_BASE_LEVEL,2+(i&3));
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAX_LEVEL,5);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,2+(i&3));
    gl.clearColor((i&1),0.1,0.2,1);gl.clear(gl.COLOR_BUFFER_BIT);
  }
  gl.finish();
  const e=gl.getError(); log("glError=0x"+e.toString(16));
  gl.deleteFramebuffer(f);gl.deleteTexture(t);
  ok("BASE_LEVEL/FBO transition completed");
  return e===gl.NO_ERROR;
}

document.getElementById("run").onclick=()=>{
  out.textContent="";
  try{
    const {gl}=makeGL();
    const results=[
      testMultiAttachmentBlit(gl),
      testFboQueryLifetime(gl),
      testBaseLevelReallocation(gl)
    ];
    log("\\n=== SUMMARY ===");
    log(results.every(Boolean) ? "[+] No WebGL error observed." :
        "[!] One or more tests reported an error.");
    log("A clean result is NOT evidence that Chrome is vulnerable.");
    log("If Chrome crashes/restarts, record the exact test number and chrome://gpu state.");
  }catch(e){fail(e.stack||e);}
};
</script>
