<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fullscreen + Folder Access (Android)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overscroll-behavior:none; }
  body {
    font-family:sans-serif; background:#111; color:#eee;
    display:flex; flex-direction:column; align-items:center;
    padding:24px 16px; gap:18px;
  }
  h1 { font-size:18px; text-align:center; }
  #btnStart {
    margin-top:30vh;
    padding:22px 44px; font-size:20px; background:#2563eb; color:#fff;
    border:none; border-radius:14px; cursor:pointer; width:90%;
  }
  #btnStart:disabled { background:#444; }
  #info { font-size:13px; color:#aaa; text-align:center; }
  #output {
    width:100%; flex-grow:1; overflow-y:auto;
    background:#1a1a1a; border-radius:10px; padding:14px;
    font-family:monospace; font-size:12px; border:1px solid #333;
    display:none;
  }
  .dir { color:#7dd3fc; }
  input[type=file] { display:none; }
</style>
</head>
<body>

<h1>1 Klik → Fullscreen → Pilih Folder</h1>
<button id="btnStart">🚀 Mulai</button>
<div id="info"></div>
<input type="file" id="inpWk" webkitdirectory directory multiple>
<div id="output"></div>

<script>
const btn = document.getElementById('btnStart');
const inp = document.getElementById('inpWk');
const info = document.getElementById('info');
const output = document.getElementById('output');
const fsaSupported = 'showDirectoryPicker' in window;

info.textContent = fsaSupported
  ? 'Metode: File System Access API (izin diingat, klik berikutnya tanpa dialog)'
  : 'Metode: webkitdirectory fallback (folder picker Android)';

btn.addEventListener('click', async () => {
  /* TAHAP 1: fullscreen dulu */
  try {
    await document.documentElement.requestFullscreen();
    // Chrome Android: tambahan supaya layar tetap nyala di fullscreen
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(() => {});
    }
  } catch (e) {
    info.textContent = 'Fullscreen ditolak, lanjut tanpa fullscreen...';
  }

  /* TAHAP 2: masih dalam gesture klik → dialog folder langsung muncul */
  if (fsaSupported) {
    try {
      const handle = await window.showDirectoryPicker();
      // izin persisten (Chrome 122+): minta sekali, diingat antar kunjungan
      await handle.requestPermission({ mode: 'readwrite' });
      btn.disabled = true;
      showList();
      log('── Folder: ' + handle.name, 'dir');
      await walk(handle, '');
    } catch (e) {
      if (e.name === 'AbortError') info.textContent = 'Pemilihan dibatalkan';
      else info.textContent = 'FSA gagal (' + e.message + '), pakai fallback...';
      fallback();
    }
  } else {
    fallback();
  }
});

function fallback() {
  // Android Chrome 147+ / WebView: folder picker Android (SAF)
  inp.click();
}

inp.addEventListener('change', () => {
  btn.disabled = true;
  showList();
  const files = [...inp.files];
  const root = files[0]?.webkitRelativePath?.split('/')[0] || '(folder)';
  log(`── Folder: ${root} — ${files.length} file`, 'dir');
  files.slice(0, 200).forEach(f => log('📄 ' + f.webkitRelativePath));
  if (files.length > 200) log(`... +${files.length - 200} file lainnya`);
});

/* Rekursif FSA */
async function walk(dir, indent) {
  for await (const [name, entry] of dir.entries()) {
    log(`${indent}${entry.kind === 'directory' ? '📁' : '📄'} ${name}`,
        entry.kind === 'directory' ? 'dir' : '');
    if (entry.kind === 'directory') await walk(entry, indent + '  ');
  }
}

function showList() {
  output.style.display = 'block';
  output.innerHTML = '';
  btn.textContent = '✅ Selesai';
}
function log(msg, cls) {
  const d = document.createElement('div');
  d.textContent = msg;
  if (cls) d.className = cls;
  output.appendChild(d);
  output.scrollTop = output.scrollHeight;
}
</script>

</body>
</html>
