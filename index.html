
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opera GX Address Bar Research</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101014;
  color: white;
  font-family: Arial, sans-serif;
  padding: 25px;
}

.container {
  max-width: 420px;
  margin: 50px auto;
  background: #1c1c24;
  padding: 25px;
  border-radius: 14px;
}

h2 {
  color: #fa315b;
}

input, button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border-radius: 7px;
  border: none;
}

input {
  background: #292933;
  color: white;
}

button {
  background: #fa315b;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.result {
  margin-top: 20px;
  padding: 12px;
  background: #292933;
  overflow-wrap: anywhere;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

<h2>Opera GX Security Research</h2>
<p>Address Bar Userinfo + One Click Login</p>

<form id="loginForm">

<input
  type="text"
  id="username"
  value="researcher@example.test"
  autocomplete="off"
  placeholder="Test username"
>

<input
  type="password"
  id="password"
  value="DUMMY-ONLY-123"
  autocomplete="off"
  placeholder="Dummy password"
>

<button type="submit">
  Continue / Login
</button>

</form>

<div class="result" id="result">
Waiting for interaction...
</div>

</div>

<script>
const form = document.getElementById("loginForm");
const result = document.getElementById("result");

form.addEventListener("submit", function(event) {
  event.preventDefault();

  const username = document.getElementById("username").value;

  result.innerHTML = `
    <strong>FORM SUBMITTED</strong><br><br>
    Username: ${escapeHTML(username)}<br>
    Password: [REDACTED]<br><br>
    Current URL: ${escapeHTML(location.href)}<br>
    Origin: ${escapeHTML(location.origin)}<br>
    Hostname: ${escapeHTML(location.hostname)}
  `;
});

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}
</script>

</body>
</html>
