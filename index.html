
<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chrome Android FSA Probe</title>
<h3>File System Access API Probe</h3>
<pre id="out">Checking...</pre>
<button id="pick">Select test file</button>
<script>
const out = document.querySelector("#out");

out.textContent = [
  "isSecureContext: " + isSecureContext,
  "showOpenFilePicker: " + typeof window.showOpenFilePicker,
  "showDirectoryPicker: " + typeof window.showDirectoryPicker,
  "showSaveFilePicker: " + typeof window.showSaveFilePicker,
].join("\n");

document.querySelector("#pick").onclick = async () => {
  try {
    if (!window.showOpenFilePicker) {
      out.textContent += "\nPicker API unavailable";
      return;
    }
    const [handle] = await showOpenFilePicker();
    out.textContent += "\nSelected: " + handle.name;
    out.textContent += "\nHandle type: " + handle.kind;
  } catch (e) {
    out.textContent += "\nResult: " + e.name + ": " + e.message;
  }
};
</script>
