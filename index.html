<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Safe WebAuthn Navigation-State Race Test</title>
<style>
body{font-family:sans-serif;padding:16px;line-height:1.4}
button{padding:12px;margin:5px 0;width:100%}
pre{white-space:pre-wrap;background:#eee;padding:10px}
</style>
<h2>WebAuthn lifecycle / navigation test</h2>
<p>Safe regression test. It never exports credentials or attempts to bypass WebAuthn.</p>
<button id="start">1. Start WebAuthn ceremony</button>
<button id="nav">2. Navigate to state B</button>
<button id="back">3. Return to state A</button>
<button id="repeat">4. Start second ceremony</button>
<pre id="log"></pre>
<script>
const out=document.querySelector("#log");
function log(s){out.textContent+=new Date().toISOString()+"  "+s+"\n";}
function rb(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return a;}
function opts(){return {publicKey:{
 challenge:rb(32),rp:{name:"Safe WebAuthn Race Test"},
 user:{id:rb(16),name:"test@example.invalid",displayName:"Test"},
 pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
 timeout:30000,authenticatorSelection:{userVerification:"discouraged"}
}};}
async function start(label){
 if(!window.PublicKeyCredential){log("WebAuthn unavailable");return;}
 log(label+": origin="+location.origin+" state="+sessionStorage.getItem("state"));
 try{
  const p=navigator.credentials.create(opts());
  log(label+": create() pending");
  const c=await p;
  log(label+": SUCCESS id="+(c?.id||"<none>")+" origin="+location.origin+
      " state="+sessionStorage.getItem("state"));
 }catch(e){
  log(label+": "+e.name+" — "+e.message+" origin="+location.origin+
      " state="+sessionStorage.getItem("state"));
 }
}
start.onclick=()=>{sessionStorage.setItem("state","A");startWeb();};
async function startWeb(){await start("A/create");}
nav.onclick=()=>{sessionStorage.setItem("state","B");history.pushState({state:"B"},"","?state=B");log("NAVIGATION: state=B origin="+location.origin);};
back.onclick=()=>{sessionStorage.setItem("state","A");history.pushState({state:"A"},"","?state=A");log("NAVIGATION: state=A origin="+location.origin);};
repeat.onclick=()=>start("A/second-create");
log("Ready. Secure origin="+location.origin);
</script>
