<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mali PACK_ROW_LENGTH Exact Regression v3</title>
<style>
body{font:14px monospace;background:#111;color:#ddd;padding:12px}
button{display:block;width:100%;margin:7px 0;padding:12px}
.ok{color:#8f8}.bad{color:#f88}.info{color:#8cf}
</style>
<h3>Mali PACK_ROW_LENGTH — exact regression v3</h3>
<div id="info"></div>
<button onclick="run(1)">TEST 1 — exact ANGLE regression shape</button>
<button onclick="run(2)">TEST 2 — same row length, 2 rows</button>
<button onclick="run(3)">TEST 3 — row length + 1</button>
<button onclick="run(4)">TEST 4 — skip rows + boundary</button>
<button id="runall" type="button">RUN ALL</button>
<pre id="out"></pre>
<script>
"use strict";

/*
 * IMPORTANT:
 * This intentionally mirrors the ANGLE regression-test geometry while
 * keeping the allocation bounded for a phone.
 *
 * The original ANGLE regression uses a ~512 MiB PBO because it tests an
 * actual very-large destination offset. This version first tests whether
 * the browser accepts the same stride/validation shape with a smaller
 * logical destination. It does NOT claim to reproduce the original
 * 512 MiB driver condition.
 */

const ROW_LENGTH = 0x07fffffc; // ANGLE regression-test value
const BPP = 4;
const ROW_BYTES = ROW_LENGTH * BPP;
const SMALL_PBO = 16 * 1024 * 1024; // bounded 16 MiB
const W = 1, H = 2;

function log(s, cls="") {
  const p=document.createElement("div");
  p.textContent=s;
  if(cls)p.className=cls;
  out.appendChild(p);
}
function fresh() {
  const c=document.createElement("canvas");
  c.width=4;c.height=4;
  const gl=c.getContext("webgl2",{antialias:false,preserveDrawingBuffer:true});
  if(!gl) throw Error("WebGL2 unavailable");
  return gl;
}
function en(gl,e) {
  return e===gl.NO_ERROR ? "NO_ERROR" :
    e===gl.INVALID_ENUM ? "INVALID_ENUM" :
    e===gl.INVALID_VALUE ? "INVALID_VALUE" :
    e===gl.INVALID_OPERATION ? "INVALID_OPERATION" :
    e===gl.OUT_OF_MEMORY ? "OUT_OF_MEMORY" :
    "0x"+e.toString(16);
}
function drain(gl){while(gl.getError()!==gl.NO_ERROR){}}

function run(n) {
  out.textContent="";
  let gl=null,pbo=null;
  try {
    gl=fresh();
    drain(gl);

    // Small deterministic framebuffer.
    gl.viewport(0,0,4,4);
    gl.clearColor(0.25,0.5,0.75,1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.finish();
    drain(gl);

    pbo=gl.createBuffer();
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER,pbo);
    gl.bufferData(gl.PIXEL_PACK_BUFFER,SMALL_PBO,gl.STREAM_READ);
    let e=gl.getError();
    if(e!==gl.NO_ERROR) {
      log("PBO allocation: "+en(gl,e),"bad");
      return;
    }

    let rl=ROW_LENGTH, skip=0, x=0, y=0, w=1, h=1;

    if(n===2) {
      h=2;
    } else if(n===3) {
      rl=ROW_LENGTH+1;
    } else if(n===4) {
      skip=1;
      h=1;
    }

    gl.pixelStorei(gl.PACK_ROW_LENGTH,rl);
    gl.pixelStorei(gl.PACK_SKIP_ROWS,skip);
    gl.pixelStorei(gl.PACK_SKIP_PIXELS,0);
    e=gl.getError();
    log("ROW_LENGTH=0x"+rl.toString(16));
    log("logical row bytes="+(rl*BPP));
    log("PBO bytes="+SMALL_PBO);
    log("skipRows="+skip+" read="+w+"x"+h);

    if(e!==gl.NO_ERROR) {
      log("pixelStore: "+en(gl,e),"bad");
      return;
    }

    gl.readPixels(x,y,w,h,gl.RGBA,gl.UNSIGNED_BYTE,0);
    e=gl.getError();
    log("readPixels="+en(gl,e));

    if(e===gl.NO_ERROR) {
      gl.finish();
      const outbuf=new Uint8Array(16);
      gl.getBufferSubData(gl.PIXEL_PACK_BUFFER,0,outbuf);
      const e2=gl.getError();
      log("getBufferSubData="+en(gl,e2));
      log("first16="+Array.from(outbuf).join(","));
    }

    log("contextLost="+gl.isContextLost());

    if(gl.isContextLost()) {
      log("UNEXPECTED CONTEXT LOSS","bad");
    } else if(e===gl.NO_ERROR) {
      log("PASS — command accepted without context loss","ok");
    } else {
      log("No security signal; command rejected/validated","info");
    }
  } catch(ex) {
    log("EXCEPTION: "+ex.message,"bad");
  } finally {
    try {
      if(gl) {
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER,null);
        if(pbo) gl.deleteBuffer(pbo);
      }
    } catch(_){}
  }
}
async function all() {
  out.textContent="";
  const b=document.getElementById("runall");
  b.disabled=true;
  try {
    for(let i=1;i<=4;i++){
      run(i);
      await new Promise(r=>setTimeout(r,500));
    }
  } finally {
    b.disabled=false;
  }
}
document.getElementById("runall").addEventListener("click", all);
try {
  const gl=fresh();
  info.textContent =
    "WebGL2="+!!gl+
    " | renderer="+gl.getParameter(gl.RENDERER)+
    " | version="+gl.getParameter(gl.VERSION);
} catch(e) {
  info.textContent=e.message;
}
</script>
