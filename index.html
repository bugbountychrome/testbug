<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANGLE Indexed Draw / Primitive Restart v1</title><pre id=o>starting...</pre>
<script>
const o=document.getElementById("o"),log=s=>o.textContent+=s+"\n";
function G(){const c=document.createElement("canvas");c.width=c.height=32;return c.getContext("webgl2",{antialias:false,preserveDrawingBuffer:true});}
function mk(gl){
 const vs=gl.createShader(gl.VERTEX_SHADER),fs=gl.createShader(gl.FRAGMENT_SHADER);
 gl.shaderSource(vs,"#version 300 es\nlayout(location=0) in vec2 p; flat out int id; void main(){gl_Position=vec4(p,0,1);id=gl_VertexID;}");
 gl.shaderSource(fs,"#version 300 es\nprecision highp float; flat in int id; out vec4 c; void main(){c=vec4(float((id%7)+1)/8.0,0,0,1);}");
 gl.compileShader(vs);gl.compileShader(fs);const p=gl.createProgram();gl.attachShader(p,vs);gl.attachShader(p,fs);gl.linkProgram(p);return p;
}
function setup(gl){
 const v=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,v);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
 -1,-1,-.5,-1,0,-1,.5,-1,1,-1,-1,0,-.5,0,0,0,.5,0,1,0,-1,1,-.5,1,0,1,.5,1,1,1]),gl.STATIC_DRAW);
 gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,8,0);
 const i=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,i);return [v,i];
}
function test(gl,n,fn){try{gl.getError();fn();let e=gl.getError();log(n+": "+(e===gl.NO_ERROR?"PASS":"GL_ERROR 0x"+e.toString(16)));}catch(e){log(n+": EXCEPTION "+e)}}
const gl=G();if(!gl)log("NO WEBGL2");else{
 log("WebGL2 OK");log("renderer="+gl.getParameter(gl.RENDERER));const p=mk(gl);gl.useProgram(p);
 const [v,i]=setup(gl);

 test(gl,"A UBYTE fixed restart boundary",()=>{
  gl.enable(gl.PRIMITIVE_RESTART_FIXED_INDEX);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint8Array([0,1,2,255,2,3,4,255,4,5,6]),gl.STATIC_DRAW);
  gl.drawElements(gl.TRIANGLES,11,gl.UNSIGNED_BYTE,0);
  gl.disable(gl.PRIMITIVE_RESTART_FIXED_INDEX);
 });

 test(gl,"B USHORT fixed restart boundary",()=>{
  gl.enable(gl.PRIMITIVE_RESTART_FIXED_INDEX);
  const x=new Uint16Array([0,1,2,65535,2,3,4,65535,4,5,6]);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,x,gl.STATIC_DRAW);
  gl.drawElements(gl.TRIANGLES,11,gl.UNSIGNED_SHORT,0);
  gl.disable(gl.PRIMITIVE_RESTART_FIXED_INDEX);
 });

 test(gl,"C restart toggle + offset",()=>{
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array([0,1,2,65535,2,3,4,5,6]),gl.STATIC_DRAW);
  gl.enable(gl.PRIMITIVE_RESTART_FIXED_INDEX);
  gl.drawElements(gl.TRIANGLES,7,gl.UNSIGNED_SHORT,2);
  gl.disable(gl.PRIMITIVE_RESTART_FIXED_INDEX);
  gl.drawElements(gl.TRIANGLES,3,gl.UNSIGNED_SHORT,4);
 });

 test(gl,"D resize/rebind index buffer",()=>{
  gl.enable(gl.PRIMITIVE_RESTART_FIXED_INDEX);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array([0,1,2,65535,2,3,4]),gl.DYNAMIC_DRAW);
  gl.drawElements(gl.TRIANGLES,7,gl.UNSIGNED_SHORT,0);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,64,gl.DYNAMIC_DRAW);
  gl.bufferSubData(gl.ELEMENT_ARRAY_BUFFER,0,new Uint16Array([0,1,2,65535,3,4,5]));
  gl.drawElements(gl.TRIANGLES,7,gl.UNSIGNED_SHORT,0);
  gl.disable(gl.PRIMITIVE_RESTART_FIXED_INDEX);
 });
 log("DONE");
}
</script>
