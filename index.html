<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width">
</head>

<body>

<button onclick="setup()">1. SETUP</button>
<button onclick="removeFile()">2. HANDLE.REMOVE()</button>
<button onclick="check()">3. CHECK</button>

<pre id="log"></pre>

<script>
let dirHandle;
let fileHandle;

function log(x) {
  document.getElementById("log").textContent += x + "\n";
}

async function setup() {
  document.getElementById("log").textContent = "";

  try {
    dirHandle = await showDirectoryPicker({
      mode: "readwrite"
    });

    log("DIRECTORY: OK");

    fileHandle =
      await dirHandle.getFileHandle("FSA_TEST.txt");

    log("FILE HANDLE: OK");

    log(
      "read = " +
      await fileHandle.queryPermission({mode:"read"})
    );

    log(
      "readwrite = " +
      await fileHandle.queryPermission({mode:"readwrite"})
    );

    const file = await fileHandle.getFile();

    log("CONTENT = " + await file.text());

  } catch (e) {
    log("SETUP ERROR: " + e.name);
    log(e.message);
  }
}

async function removeFile() {
  try {

    log("");
    log("=== HANDLE.REMOVE ===");

    await fileHandle.remove();

    log("handle.remove(): SUCCESS");

  } catch (e) {

    log("handle.remove(): " + e.name);
    log(e.message);

  }

  try {
    log(
      "read after remove = " +
      await fileHandle.queryPermission({mode:"read"})
    );

    log(
      "readwrite after remove = " +
      await fileHandle.queryPermission({mode:"readwrite"})
    );
  } catch (e) {
    log("permission check error: " + e.name);
  }

  try {
    await fileHandle.getFile();
    log("OLD HANDLE READ: SUCCESS");
  } catch (e) {
    log("OLD HANDLE READ: " + e.name);
  }

  log("");
  log("Sekarang recreate FSA_TEST.txt dari Termux.");
}

async function check() {

  try {

    log("");
    log("=== CHECK ===");

    log(
      "old read = " +
      await fileHandle.queryPermission({mode:"read"})
    );

    log(
      "old readwrite = " +
      await fileHandle.queryPermission({mode:"readwrite"})
    );

    const file = await fileHandle.getFile();

    log("OLD HANDLE READ: SUCCESS");
    log("CONTENT = " + await file.text());

  } catch (e) {

    log("OLD HANDLE READ: " + e.name);
    log(e.message);

  }
}
</script>

</body>
</html>
