<!doctype html>
<meta charset="utf-8">
<title>Chrome Permission Test</title>

<button onclick="requestCamera()">Request Camera</button>
<button onclick="requestMicrophone()">Request Microphone</button>
<button onclick="requestBoth()">Request Camera + Microphone</button>

<pre id="result"></pre>

<script>
const result = document.getElementById("result");

async function request(constraints) {
  result.textContent = "Requesting permission...";

  try {
    const stream =
      await navigator.mediaDevices.getUserMedia(constraints);

    // The PoC does not continuously record.
    // Immediately release the granted media devices.
    stream.getTracks().forEach(track => track.stop());

    result.textContent = "Permission granted";
  } catch (e) {
    result.textContent = e.name;
  }
}

function requestCamera() {
  request({ video: true });
}

function requestMicrophone() {
  request({ audio: true });
}

function requestBoth() {
  request({
    video: true,
    audio: true
  });
}
</script>
