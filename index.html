<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebGPU Dawn Buffer Lifetime Regression v1</title>
<style>
body{font-family:monospace;background:#111;color:#ddd;padding:16px}
button{display:block;width:100%;padding:14px;margin:10px 0;font:inherit}
pre{white-space:pre-wrap;word-break:break-word}
.ok{color:#8f8}.bad{color:#f88}
</style>
<h3>WebGPU Dawn Buffer Lifetime Regression</h3>
<p>Bounded lifecycle tests for mappedAtCreation buffers and GPUDevice.destroy().</p>
<button id="a">A — mappedAtCreation → destroy</button>
<button id="b">B — mapAsync → destroy</button>
<button id="c">C — destroy/recreate ×20</button>
<button id="d">D — mapped buffers + queue submit ×20</button>
<pre id="log">Ready.</pre>
<script>
(async()=>{
"use strict";
const out=document.getElementById("log");
const log=(s,c)=>{const e=document.createElement("div");e.textContent=s;if(c)e.className=c;out.appendChild(e)};
const reset=()=>out.textContent="";
if(!navigator.gpu){out.textContent="WebGPU unavailable";return}

let adapter,device;
try{
 adapter=await navigator.gpu.requestAdapter();
 if(!adapter){out.textContent="No WebGPU adapter";return}
 device=await adapter.requestDevice();
}catch(e){out.textContent="WebGPU init failed: "+e;return}

log("WebGPU: available");
log("Adapter: "+(adapter.info?.architecture||"unknown"));
log("Device: ready");

let uncaptured=0;
device.addEventListener("uncapturederror",e=>{
 uncaptured++;
 log("[WebGPU error] "+e.error.message,"bad");
});

let lost=false;
device.lost.then(info=>{
 lost=true;
 log("[DEVICE LOST] "+info.reason+" "+(info.message||""),"bad");
});

function fresh(){
 return device;
}
function checkLost(){
 if(lost){log("[FAIL] device lost","bad");return false}
 return true;
}
function buf(size=4096){
 return fresh().createBuffer({
   size,
   usage:GPUBufferUsage.MAP_WRITE|GPUBufferUsage.COPY_SRC,
   mappedAtCreation:true
 });
}
function fill(b,size=4096){
 const a=new Uint8Array(b.getMappedRange());
 for(let i=0;i<size;i++)a[i]=(i*31)&255;
}
function pass(){
 if(lost)return;
 log("[PASS] no device loss","ok");
}

/*
 A: mappedAtCreation buffer is unmapped before device destruction.
 The important regression property is safe teardown.
 */
document.getElementById("a").onclick=async()=>{
 reset(); log("=== TEST A: mappedAtCreation → destroy ===");
 try{
   const d=fresh();
   const b=d.createBuffer({
     size:4096,
     usage:GPUBufferUsage.MAP_WRITE|GPUBufferUsage.COPY_SRC,
     mappedAtCreation:true
   });
   fill(b);
   b.unmap();

   d.destroy();

   // Must not resurrect or expose the old mapping.
   try{ b.unmap(); log("[INFO] second unmap rejected/ignored by API"); }catch(e){
     log("[INFO] post-destroy unmap threw as expected");
   }
   checkLost();
 }catch(e){log("[INFO] synchronous API rejection: "+e.message)}
};

/*
 B: mapAsync pending while device is destroyed.
 */
document.getElementById("b").onclick=async()=>{
 reset(); log("=== TEST B: mapAsync → destroy ===");
 try{
   const d=fresh();
   const b=d.createBuffer({
     size:4096,
     usage:GPUBufferUsage.MAP_READ|GPUBufferUsage.COPY_DST
   });

   const p=b.mapAsync(GPUMapMode.READ).then(
     ()=>log("[INFO] mapAsync fulfilled"),
     e=>log("[INFO] mapAsync rejected: "+e.message)
   );

   d.destroy();
   await Promise.race([p,new Promise(r=>setTimeout(r,250))]);
   checkLost();
 }catch(e){log("[INFO] synchronous API rejection: "+e.message)}
};

/*
 C: bounded device/buffer lifecycle recreation.
 */
document.getElementById("c").onclick=async()=>{
 reset(); log("=== TEST C: destroy/recreate ×20 ===");
 let ok=true;

 for(let i=1;i<=20;i++){
   try{
     const ad=await navigator.gpu.requestAdapter();
     if(!ad){ok=false;break}
     const d=await ad.requestDevice();

     const b=d.createBuffer({
       size:4096,
       usage:GPUBufferUsage.MAP_WRITE|GPUBufferUsage.COPY_SRC,
       mappedAtCreation:true
     });
     fill(b);
     b.unmap();
     d.destroy();

     if(i===1||i===20)log("cycle "+i+" complete");
   }catch(e){
     log("cycle "+i+" exception: "+e.message);
     ok=false;break;
   }
 }
 if(ok)log("[PASS] 20 lifecycle cycles completed","ok");
};

/*
 D: mapped buffers + bounded queue submissions.
 This intentionally uses normal validation-safe command ordering.
 */
document.getElementById("d").onclick=async()=>{
 reset(); log("=== TEST D: mapped buffers + queue submit ×20 ===");
 try{
   const d=fresh();

   const src=d.createBuffer({
     size:4096,
     usage:GPUBufferUsage.MAP_WRITE|GPUBufferUsage.COPY_SRC,
     mappedAtCreation:true
   });
   fill(src);
   src.unmap();

   const dst=d.createBuffer({
     size:4096,
     usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.COPY_SRC|
           GPUBufferUsage.MAP_READ
   });

   for(let i=1;i<=20;i++){
     const enc=d.createCommandEncoder();
     enc.copyBufferToBuffer(src,0,dst,0,4096);
     d.queue.submit([enc.finish()]);

     if(i===1||i===20)log("submit "+i+" complete");
   }

   await d.queue.onSubmittedWorkDone();
   checkLost();
   if(!lost)log("[PASS] 20 submissions completed","ok");
 }catch(e){
   log("[INFO] WebGPU operation rejected: "+e.message);
 }
};
})();
</script>
