<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width">
  <title>Android Installed Apps Boundary</title>
</head>

<body>

<h3>Installed Apps Boundary Test</h3>

<button onclick="testTop()">TEST TOP LEVEL</button>
<button onclick="testFrame()">TEST CROSS ORIGIN FRAME</button>

<pre id="log"></pre>

<script>
function log(x) {
  document.getElementById("log").textContent += x + "\n";
}

async function testTop() {
  log("");
  log("=== TOP LEVEL ===");
  log("origin: " + location.origin);

  if (!("getInstalledRelatedApps" in navigator)) {
    log("API: NOT SUPPORTED");
    return;
  }

  log("API: SUPPORTED");

  try {
    const apps = await navigator.getInstalledRelatedApps();

    log("SUCCESS");
    log("count: " + apps.length);

    for (const app of apps) {
      log(JSON.stringify(app));
    }

  } catch (e) {
    log("ERROR: " + e.name);
    log(e.message);
  }
}

function testFrame() {
  log("");
  log("=== CROSS ORIGIN FRAME ===");

  const frame = document.createElement("iframe");

  frame.src =
    "https://example.com/";

  frame.style.width = "100%";
  frame.style.height = "100px";

  document.body.appendChild(frame);

  log("iframe created");
  log("iframe origin: https://example.com");
}
</script>

</body>
</html>
