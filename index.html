<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opera Mini Popup Policy Test</title>
</head>
<body>
  <h2>Popup Policy Test</h2>
  <p>Wait 5 seconds. Do not touch the screen.</p>
  <pre id="out">Waiting...</pre>

  <script>
    let count = 0;
    const results = [];

    function attempt() {
      count++;

      const w = window.open(
        'https://example.com/?popup_test=' + count,
        '_blank'
      );

      results.push(
        'Attempt ' + count + ': ' +
        (w ? 'handle returned' : 'blocked/null')
      );

      document.getElementById('out').textContent =
        results.join('\n');

      if (count < 5) {
        setTimeout(attempt, 1000);
      }
    }

    setTimeout(attempt, 1500);
  </script>
</body>
</html>
