<!doctype html>
<meta name="viewport" content="width=device-width">

<h3>Android WebGPU Boundary Test</h3>
<pre id="log"></pre>

<script>
const log = x => {
  document.querySelector("#log").textContent += x + "\n";
};

(async () => {
  if (!navigator.gpu) {
    log("WebGPU: NOT SUPPORTED");
    return;
  }

  log("WebGPU: SUPPORTED");

  try {
    const adapter = await navigator.gpu.requestAdapter();

    if (!adapter) {
      log("Adapter: NONE");
      return;
    }

    log("Adapter: OK");

    const info = await adapter.requestAdapterInfo?.();

    if (info) {
      log("vendor: " + info.vendor);
      log("architecture: " + info.architecture);
      log("device: " + info.device);
      log("description: " + info.description);
    }

    const device = await adapter.requestDevice();

    log("Device: OK");

    device.lost.then(info => {
      log("DEVICE LOST: " + info.reason);
      log(info.message || "");
    });

  } catch (e) {
    log("ERROR: " + e);
  }
})();
</script>
