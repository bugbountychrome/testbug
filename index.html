<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width">
  <title>FSA Permission Test</title>
</head>

<body>

<button onclick="testPermission()">TEST FILE SYSTEM ACCESS</button>

<pre id="log"></pre>

<script>
let handle = null;

function log(text) {
  document.getElementById("log").textContent += text + "\n";
}

async function testPermission() {
  document.getElementById("log").textContent = "";

  try {
    log("Origin: " + location.origin);

    if (!window.showOpenFilePicker) {
      log("showOpenFilePicker: NOT SUPPORTED");
      return;
    }

    log("showOpenFilePicker: SUPPORTED");

    // Pilih file dummy milik sendiri
    const result = await showOpenFilePicker({
      multiple: false
    });

    handle = result[0];

    log("HANDLE CREATED");
    log("kind: " + handle.kind);
    log("name: " + handle.name);

    // Cek permission
    const query = await handle.queryPermission({
      mode: "read"
    });

    log("queryPermission: " + query);

    // Request permission
    const request = await handle.requestPermission({
      mode: "read"
    });

    log("requestPermission: " + request);

    // Ambil file
    const file = await handle.getFile();

    log("getFile: SUCCESS");
    log("file.name: " + file.name);
    log("file.size: " + file.size);
    log("file.type: " + file.type);

    // Baca sedikit metadata saja
    const buffer = await file.slice(0, 16).arrayBuffer();

    const bytes = [...new Uint8Array(buffer)]
      .map(x => x.toString(16).padStart(2, "0"))
      .join(" ");

    log("first 16 bytes: " + bytes);

    log("");
    log("=== TEST COMPLETE ===");

  } catch (e) {

    log("ERROR: " + e.name);
    log("MESSAGE: " + e.message);

  }
}
</script>

</body>
</html>
