<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANGLE Program Relink State v1</title>
<pre id=o>starting...</pre>
<script>
const O=document.getElementById("o");
const log=s=>O.textContent+=s+"\n";
function ctx(){
  const c=document.createElement("canvas"); c.width=c.height=16;
  return c.getContext("webgl2",{antialias:false,preserveDrawingBuffer:true});
}
function sh(gl,t,s){
  const x=gl.createShader(t); gl.shaderSource(x,s); gl.compileShader(x);
  if(!gl.getShaderParameter(x,gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(x));
  return x;
}
function prog(gl,fs){
  const p=gl.createProgram();
  const v=sh(gl,gl.VERTEX_SHADER,`#version 300 es
  layout(location=0) in vec2 p; void main(){gl_Position=vec4(p,0,1);}`);
  const f=sh(gl,gl.FRAGMENT_SHADER,fs);
  gl.attachShader(p,v); gl.attachShader(p,f); gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw Error(gl.getProgramInfoLog(p));
  return p;
}
function setup(gl){
  const b=gl.createBuffer(), vao=gl.createVertexArray();
  gl.bindVertexArray(vao); gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,8,0);
  return [b,vao];
}
function pixel(gl){
  const a=new Uint8Array(4); gl.readPixels(8,8,1,1,gl.RGBA,gl.UNSIGNED_BYTE,a); return [...a];
}
function run(gl,name,fn){
  try{
    gl.getError(); gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
    fn(); const e=gl.getError();
    log(name+": "+(e===gl.NO_ERROR?"PASS":"GL_ERROR 0x"+e.toString(16))+" pixel="+pixel(gl));
  }catch(e){log(name+": EXCEPTION "+e)}
}
const gl=ctx();
if(!gl) log("NO WEBGL2");
else {
  log("WebGL2 OK");
  log("renderer="+gl.getParameter(gl.RENDERER));
  const vsDummy=0;

  // A: relink currently used program, same interface, changed constant.
  run(gl,"A relink active program",()=>{
    const p=prog(gl,`#version 300 es
      precision highp float; out vec4 c; void main(){c=vec4(1,0,0,1);}`);
    gl.useProgram(p); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    gl.shaderSource(gl.getAttachedShaders(p)[1],
      `#version 300 es
       precision highp float; out vec4 c; void main(){c=vec4(0,1,0,1);}`);
    gl.compileShader(gl.getAttachedShaders(p)[1]);
    gl.linkProgram(p); gl.useProgram(p); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  });

  // B: relink changes sampler interface while texture binding remains live.
  run(gl,"B relink sampler + texture binding",()=>{
    const tex=gl.createTexture(); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([255,0,0,255]));
    const p=prog(gl,`#version 300 es
      precision highp float; uniform sampler2D s; out vec4 c;
      void main(){c=texture(s,vec2(.5));}`);
    gl.useProgram(p); gl.uniform1i(gl.getUniformLocation(p,"s"),0); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    const fs=gl.getAttachedShaders(p)[1];
    gl.shaderSource(fs,`#version 300 es
      precision highp float; uniform sampler2D s; out vec4 c;
      void main(){c=texture(s,vec2(.5))*vec4(0,1,1,1);}`);
    gl.compileShader(fs); gl.linkProgram(p); gl.useProgram(p);
    gl.uniform1i(gl.getUniformLocation(p,"s"),0); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  });

  // C: relink while VAO state and attribute setup remain active.
  run(gl,"C relink + persistent VAO",()=>{
    const [b,vao]=setup(gl);
    const p=prog(gl,`#version 300 es
      precision highp float; out vec4 c; void main(){c=vec4(1,1,0,1);}`);
    gl.useProgram(p); gl.bindVertexArray(vao); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    const fs=gl.getAttachedShaders(p)[1];
    gl.shaderSource(fs,`#version 300 es
      precision highp float; out vec4 c; void main(){c=vec4(0,0,1,1);}`);
    gl.compileShader(fs); gl.linkProgram(p); gl.useProgram(p);
    gl.bindVertexArray(vao); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  });

  // D: repeated relink/use/draw with texture state changing between links.
  run(gl,"D relink + texture-state churn x12",()=>{
    const tex=gl.createTexture(); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,2,2,0,gl.RGBA,gl.UNSIGNED_BYTE,
      new Uint8Array(16).fill(127));
    const p=prog(gl,`#version 300 es
      precision highp float; uniform sampler2D s; out vec4 c;
      void main(){c=texture(s,vec2(.5));}`);
    const fs=gl.getAttachedShaders(p)[1];
    for(let i=0;i<12;i++){
      gl.useProgram(p); gl.uniform1i(gl.getUniformLocation(p,"s"),0);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,(i&1)?gl.REPEAT:gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,(i&2)?gl.REPEAT:gl.CLAMP_TO_EDGE);
      gl.shaderSource(fs,`#version 300 es
        precision highp float; uniform sampler2D s; out vec4 c;
        void main(){c=texture(s,vec2(.5))+vec4(${(i%3)/10}.0,0,0,0);}`);
      gl.compileShader(fs); gl.linkProgram(p); gl.useProgram(p);
      gl.uniform1i(gl.getUniformLocation(p,"s"),0); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    }
  });
  log("DONE");
}
</script>
