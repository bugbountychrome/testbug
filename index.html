<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width">
  <title>FSA Read Grant Test</title>
</head>

<body>

<button onclick="setup()">1. PILIH FOLDER</button>
<button onclick="readFile()">2. BACA FILE</button>
<button onclick="resetLog()">CLEAR</button>

<pre id="log"></pre>

<script>
let dirHandle = null;
let fileHandle = null;

function log(x) {
  document.getElementById("log").textContent += x + "\n";
}

function resetLog() {
  document.getElementById("log").textContent = "";
}

async function setup() {
  resetLog();

  try {
    log("Origin: " + location.origin);

    dirHandle = await window.showDirectoryPicker();

    log("DIRECTORY HANDLE: OK");

    fileHandle = await dirHandle.getFileHandle(
      "FSA_TEST.txt"
    );

    log("FILE HANDLE: OK");
    log("name: " + fileHandle.name);

    const permission = await fileHandle.queryPermission({
      mode: "read"
    });

    log("permission: " + permission);

  } catch (e) {
    log("ERROR: " + e.name);
    log(e.message);
  }
}

async function readFile() {
  try {

    if (!fileHandle) {
      log("No file handle. Run SETUP first.");
      return;
    }

    log("");
    log("=== READING ===");

    const permission = await fileHandle.queryPermission({
      mode: "read"
    });

    log("permission: " + permission);

    const file = await fileHandle.getFile();

    log("getFile: SUCCESS");
    log("name: " + file.name);
    log("size: " + file.size);

    const text = await file.text();

    log("CONTENT: " + text);

  } catch (e) {

    log("READ ERROR: " + e.name);
    log(e.message);

  }
}
</script>

</body>
</html>
