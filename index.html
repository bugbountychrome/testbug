<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width">
  <title>FSA Rename Round-Trip Test</title>
</head>

<body>

<button onclick="setup()">1. SETUP</button>
<button onclick="removeOld()">2. REMOVE</button>
<button onclick="check()">3. CHECK</button>

<pre id="log"></pre>

<script>
let dir = null;
let oldFile = null;

function log(x) {
  document.getElementById("log").textContent += x + "\n";
}

async function setup() {
  document.getElementById("log").textContent = "";

  try {
    dir = await showDirectoryPicker({
      mode: "readwrite"
    });

    log("DIRECTORY: OK");

    oldFile = await dir.getFileHandle("FSA_TEST.txt");

    log("OLD HANDLE: OK");
    log("permission = " +
      await oldFile.queryPermission({mode:"read"}));

    const f = await oldFile.getFile();
    log("OLD CONTENT = " + await f.text());

  } catch (e) {
    log("SETUP ERROR: " + e.name);
    log(e.message);
  }
}

async function removeOld() {
  try {
    if (!dir) {
      log("RUN SETUP FIRST");
      return;
    }

    await dir.removeEntry("FSA_TEST.txt");

    log("");
    log("REMOVE: SUCCESS");
    log("OLD FILE DELETED");
    log("");
    log("Sekarang buat file baru:");
    log("FSA_TEST.txt");
    log("dengan Termux:");
    log("RECREATED_12345");

  } catch (e) {
    log("REMOVE ERROR: " + e.name);
    log(e.message);
  }
}

async function check() {
  try {
    log("");
    log("=== BEFORE RENAME ===");

    const newFile =
      await dir.getFileHandle("FSA_TEST.txt");

    log("NEW HANDLE: OK");

    log("new permission = " +
      await newFile.queryPermission({mode:"read"}));

    const before = await newFile.getFile();

    log("NEW CONTENT = " + await before.text());

    log("");
    log("=== OLD HANDLE ===");

    try {
      const old = await oldFile.getFile();
      log("OLD HANDLE READ = SUCCESS");
      log("OLD CONTENT = " + await old.text());
    } catch (e) {
      log("OLD HANDLE READ = " + e.name);
    }

    log("");
    log("Sekarang rename file baru secara eksternal:");
    log("FSA_TEST.txt -> ROUNDTRIP.txt");
    log("ROUNDTRIP.txt -> FSA_TEST.txt");

  } catch (e) {
    log("CHECK ERROR: " + e.name);
    log(e.message);
  }
}
</script>

</body>
</html>
