<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mali Texture Upload Regression v1</title>
<style>
body{font-family:monospace;background:#111;color:#eee;padding:16px}
button{font-size:16px;padding:10px;margin:4px 0}
pre{white-space:pre-wrap;word-break:break-word}
.ok{color:#7f7}.bad{color:#f77}
</style>
</head>
<body>
<h3>Mali Texture Upload Regression v1</h3>
<button id="run">Run bounded matrix</button>
<pre id="out">Ready.</pre>

<script>
"use strict";
const out = document.getElementById("out");
function log(s){ out.textContent += s + "\\n"; }
function hex(x){ return "0x"+x.toString(16); }

let gl;
function setup(){
  const c=document.createElement("canvas");
  gl=c.getContext("webgl2",{antialias:false,preserveDrawingBuffer:false});
  if(!gl) throw new Error("WebGL2 unavailable");
  log("Renderer: "+gl.getParameter(gl.RENDERER));
  log("Vendor: "+gl.getParameter(gl.VENDOR));
  log("Version: "+gl.getParameter(gl.VERSION));
  log("GLSL: "+gl.getParameter(gl.SHADING_LANGUAGE_VERSION));
  log("");
}

function err(label){
  const e=gl.getError();
  if(e!==gl.NO_ERROR) log("[!] "+label+" GL error="+hex(e));
  return e;
}

function makePixels(w,h,seed){
  const a=new Uint8Array(w*h*4);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      a[i]=(x*13+y*7+seed)&255;
      a[i+1]=(x*3+y*17+seed*5)&255;
      a[i+2]=(x^y^seed)&255;
      a[i+3]=255;
    }
  }
  return a;
}

function checksumTexture(tex,w,h){
  const f=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  const status=gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if(status!==gl.FRAMEBUFFER_COMPLETE){
    gl.deleteFramebuffer(f);
    return {status};
  }
  const p=new Uint8Array(w*h*4);
  gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,p);
  let s=0;
  for(let i=0;i<p.length;i++) s=(s + p[i]*(i+1))>>>0;
  gl.deleteFramebuffer(f);
  return {status,checksum:s};
}

function test(name,fn){
  log("=== "+name+" ===");
  try{
    gl.getError();
    fn();
    const e=gl.getError();
    if(e===gl.NO_ERROR) log("[PASS] no GL error");
    else log("[FAIL] GL error="+hex(e));
  }catch(e){
    log("[EXCEPTION] "+e);
  }
  if(gl.isContextLost()) log("[!!!] CONTEXT LOST");
  log("");
}

function uploadCase(label, opts){
  test(label,()=>{
    const w=opts.w, h=opts.h, level=opts.level||0;
    const tw=Math.max(1,w>>level), th=Math.max(1,h>>level);
    const tex=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

    const pixels=makePixels(tw,th,opts.seed||1);

    if(opts.pbo){
      const pbo=gl.createBuffer();
      gl.bindBuffer(gl.PIXEL_UNPACK_BUFFER,pbo);
      gl.bufferData(gl.PIXEL_UNPACK_BUFFER,pixels,gl.STREAM_DRAW);
      gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
      gl.texImage2D(gl.TEXTURE_2D,level,gl.RGBA8,tw,th,0,
                    gl.RGBA,gl.UNSIGNED_BYTE,0);
      gl.bindBuffer(gl.PIXEL_UNPACK_BUFFER,null);
      gl.deleteBuffer(pbo);
    }else{
      gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
      gl.texImage2D(gl.TEXTURE_2D,level,gl.RGBA8,tw,th,0,
                    gl.RGBA,gl.UNSIGNED_BYTE,pixels);
    }

    if(opts.sub){
      const p2=makePixels(tw,th,(opts.seed||1)+77);
      if(opts.pbo){
        const pbo2=gl.createBuffer();
        gl.bindBuffer(gl.PIXEL_UNPACK_BUFFER,pbo2);
        gl.bufferData(gl.PIXEL_UNPACK_BUFFER,p2,gl.STREAM_DRAW);
        gl.texSubImage2D(gl.TEXTURE_2D,level,0,0,tw,th,
                         gl.RGBA,gl.UNSIGNED_BYTE,0);
        gl.bindBuffer(gl.PIXEL_UNPACK_BUFFER,null);
        gl.deleteBuffer(pbo2);
      }else{
        gl.texSubImage2D(gl.TEXTURE_2D,level,0,0,tw,th,
                         gl.RGBA,gl.UNSIGNED_BYTE,p2);
      }
    }

    const e=gl.getError();
    if(e!==gl.NO_ERROR) throw new Error("upload error "+hex(e));

    // For level 0, attach and checksum. For nonzero levels, verify the
    // texture remains usable without forcing an invalid framebuffer setup.
    if(level===0){
      const r=checksumTexture(tex,tw,th);
      if(r.status!==gl.FRAMEBUFFER_COMPLETE)
        throw new Error("FBO status "+hex(r.status));
      log("[+] checksum="+r.checksum);
    }else{
      gl.bindTexture(gl.TEXTURE_2D,tex);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_BASE_LEVEL,level);
      const r=checksumTexture(tex,tw,th);
      if(r.status!==gl.FRAMEBUFFER_COMPLETE)
        throw new Error("nonzero-level FBO status "+hex(r.status));
      log("[+] level="+level+" checksum="+r.checksum);
    }

    gl.deleteTexture(tex);
  });
}

document.getElementById("run").onclick=()=>{
  out.textContent="";
  try{
    setup();

    log("=== Environment ===");
    log("MAX_TEXTURE_SIZE="+gl.getParameter(gl.MAX_TEXTURE_SIZE));
    log("MAX_COMBINED_TEXTURE_IMAGE_UNITS="+
        gl.getParameter(gl.MAX_COMBINED_TEXTURE_IMAGE_UNITS));
    log("");

    // Baseline: POT / level 0
    uploadCase("A: TexImage2D POT level 0",{
      w:64,h:64,level:0,pbo:false,sub:false,seed:11
    });

    // PBO upload baseline
    uploadCase("B: TexImage2D POT level 0 + PBO",{
      w:64,h:64,level:0,pbo:true,sub:false,seed:12
    });

    // TexSubImage2D baseline
    uploadCase("C: TexImage2D + TexSubImage2D POT level 0",{
      w:64,h:64,level:0,pbo:false,sub:true,seed:13
    });

    // NPOT upload path
    uploadCase("D: TexImage2D NPOT level 0",{
      w:63,h:47,level:0,pbo:false,sub:false,seed:14
    });

    // NPOT + PBO
    uploadCase("E: TexImage2D NPOT level 0 + PBO",{
      w:63,h:47,level:0,pbo:true,sub:false,seed:15
    });

    // Nonzero mip, with BASE_LEVEL making it the active level.
    uploadCase("F: TexImage2D level 1 + BASE_LEVEL=1",{
      w:64,h:64,level:1,pbo:false,sub:false,seed:16
    });

    // Nonzero mip + PBO.
    uploadCase("G: TexImage2D level 1 + BASE_LEVEL=1 + PBO",{
      w:64,h:64,level:1,pbo:true,sub:false,seed:17
    });

    // Nonzero mip + TexSubImage2D.
    uploadCase("H: TexImage2D + TexSubImage2D level 1 + BASE_LEVEL=1",{
      w:64,h:64,level:1,pbo:false,sub:true,seed:18
    });

    // NPOT + nonzero mip + PBO.
    uploadCase("I: NPOT level 1 + BASE_LEVEL=1 + PBO",{
      w:63,h:47,level:1,pbo:true,sub:true,seed:19
    });

    log("=== SUMMARY ===");
    if(gl.isContextLost()) log("[!!!] WebGL context is LOST");
    else log("[+] WebGL context remains active");
    log("Look for: context loss, browser/tab crash, deterministic checksum mismatch,");
    log("unexpected INVALID_OPERATION/OUT_OF_MEMORY, or a repeatable difference");
    log("between PBO/non-PBO and POT/NPOT paths.");
  }catch(e){
    log("[FATAL] "+e);
  }
};
</script>
</body>
</html>
