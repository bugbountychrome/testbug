<!doctype html>
<meta name="viewport" content="width=device-width">

<h3>Android Intent Boundary Test</h3>

<button onclick="test1()">TEST INTENT</button>
<button onclick="test2()">TEST VIEW</button>

<pre id="log"></pre>

<script>
const log = x => {
  document.getElementById("log").textContent +=
    new Date().toISOString() + " " + x + "\n";
};

function test1() {
  log("Launching intent URL...");

  location.href =
    "intent://example.com/#Intent;" +
    "scheme=https;" +
    "action=android.intent.action.VIEW;" +
    "end";
}

function test2() {
  log("Launching normal HTTPS...");

  location.href = "https://example.com/";
}

window.addEventListener("pagehide", () => log("PAGEHIDE"));
window.addEventListener("visibilitychange", () =>
  log("VISIBILITY=" + document.visibilityState)
);
</script>
