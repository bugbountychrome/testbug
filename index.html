<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tester</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; background: #fff; }
    button {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 15px 30px; font-size: 18px; background: #007aff; color: #fff;
      border: none; border-radius: 10px; cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="startBtn">CLICK HERE</button>

  <script>
    function blockRenderer(ms) {
      const start = performance.now();
      while (performance.now() - start < ms) {
        // workload ringan biar loop nggak di-eliminasi optimizer
        Math.sqrt(performance.now());
      }
    }

    document.getElementById("startBtn").onclick = function () {
      // Blok renderer tepat saat commit navigasi:
      window.addEventListener("pagehide", function () {
        blockRenderer(15000);
      }, { once: false });
      window.addEventListener("unload", function () {
        blockRenderer(15000);
      }, { once: false });

      // Konten spoof perlu sempat terpaint dulu — sudah terpaint karena
      // halaman ini sudah terbuka. Langsung navigasi:
      location.href = "https://www.google.com";
    };
  </script>
</body>
</html>
