<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANGLE Texture Reallocation + FBO State v1</title>
<pre id=o>starting...</pre>
<script>
const o=document.getElementById("o"), log=s=>o.textContent+=s+"\n";
function G(){const c=document.createElement("canvas");c.width=c.height=32;
 return c.getContext("webgl2",{antialias:false,preserveDrawingBuffer:true});}
function err(gl){return gl.getError();}
function makeTex(gl,w,h,data=null){
 const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,data);
 return t;
}
function fbo(gl,t,level=0){
 const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f);
 gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,level);
 return f;
}
function prog(gl){
 const vs=gl.createShader(gl.VERTEX_SHADER),fs=gl.createShader(gl.FRAGMENT_SHADER);
 gl.shaderSource(vs,"#version 300 es\nvoid main(){vec2 p=vec2(-1.0+float(gl_VertexID&1)*2.0,-1.0+float((gl_VertexID>>1)&1)*2.0);gl_Position=vec4(p,0,1);}");
 gl.shaderSource(fs,"#version 300 es\nprecision highp float; uniform vec4 u; out vec4 c; void main(){c=u;}");
 gl.compileShader(vs);gl.compileShader(fs);
 const p=gl.createProgram();gl.attachShader(p,vs);gl.attachShader(p,fs);gl.linkProgram(p);return p;
}
function run(gl,n,fn){
 try{gl.getError();fn();const e=gl.getError();
   log(n+": "+(e===gl.NO_ERROR?"PASS":"GL_ERROR 0x"+e.toString(16)));
 }catch(e){log(n+": EXCEPTION "+e)}
}
const gl=G();
if(!gl) log("NO WEBGL2"); else {
 log("WebGL2 OK");
 log("renderer="+gl.getParameter(gl.RENDERER));
 const p=prog(gl), u=gl.getUniformLocation(p,"u");

 // A: attached texture resized smaller, then FBO is rebound and drawn.
 run(gl,"A attached mutable resize down/up",()=>{
   const t=makeTex(gl,16,16,new Uint8Array(16*16*4).fill(17));
   const f=fbo(gl,t); gl.viewport(0,0,16,16); gl.useProgram(p);
   gl.uniform4f(u,1,0,0,1); gl.drawArrays(gl.TRIANGLES,0,3);
   gl.bindTexture(gl.TEXTURE_2D,t); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,4,4,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(4*4*4).fill(33));
   gl.bindFramebuffer(gl.FRAMEBUFFER,f); gl.viewport(0,0,4,4);
   gl.uniform4f(u,0,1,0,1); gl.drawArrays(gl.TRIANGLES,0,3);
   gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,16,16,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(16*16*4).fill(55));
   gl.bindFramebuffer(gl.FRAMEBUFFER,f); gl.viewport(0,0,16,16);
   gl.uniform4f(u,0,0,1,1); gl.drawArrays(gl.TRIANGLES,0,3);
 });

 // B: FBO attachment switches between two mutable textures while one is reallocated.
 run(gl,"B attachment switch + reallocation",()=>{
   const a=makeTex(gl,8,8),b=makeTex(gl,8,8); const f=gl.createFramebuffer();
   gl.bindFramebuffer(gl.FRAMEBUFFER,f); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,a,0);
   gl.viewport(0,0,8,8);gl.useProgram(p);gl.uniform4f(u,1,0,0,1);gl.drawArrays(gl.TRIANGLES,0,3);
   gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,b,0);
   gl.uniform4f(u,0,1,0,1);gl.drawArrays(gl.TRIANGLES,0,3);
   gl.bindTexture(gl.TEXTURE_2D,a);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,2,2,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(16).fill(77));
   gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,a,0);
   gl.viewport(0,0,2,2);gl.uniform4f(u,0,0,1,1);gl.drawArrays(gl.TRIANGLES,0,3);
 });

 // C: mip level attachment + redefine attached level and switch base/max state.
 run(gl,"C mip attachment + base/max churn",()=>{
   const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
   gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
   for(let l=0;l<4;l++) gl.texImage2D(gl.TEXTURE_2D,l,gl.RGBA8,16>>l,16>>l,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array((16>>l)*(16>>l)*4).fill(20+l));
   const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);
   gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,2);
   gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_BASE_LEVEL,1);
   gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAX_LEVEL,3);
   gl.viewport(0,0,4,4);gl.useProgram(p);gl.uniform4f(u,1,1,0,1);gl.drawArrays(gl.TRIANGLES,0,3);
   gl.bindTexture(gl.TEXTURE_2D,t);
   gl.texImage2D(gl.TEXTURE_2D,2,gl.RGBA8,8,8,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(8*8*4).fill(99));
   gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.viewport(0,0,8,8);gl.uniform4f(u,0,1,1,1);gl.drawArrays(gl.TRIANGLES,0,3);
 });

 // D: delete/recreate texture name after detaching, with persistent FBO object.
 run(gl,"D detach-delete-recreate",()=>{
   let t=makeTex(gl,8,8),f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);
   gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
   gl.viewport(0,0,8,8);gl.useProgram(p);gl.uniform4f(u,1,0,1,1);gl.drawArrays(gl.TRIANGLES,0,3);
   gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,null,0);
   gl.deleteTexture(t);
   t=makeTex(gl,4,4,new Uint8Array(64).fill(123));
   gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
   gl.viewport(0,0,4,4);gl.uniform4f(u,1,1,1,1);gl.drawArrays(gl.TRIANGLES,0,3);
 });
 log("DONE");
}
</script>
