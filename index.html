<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANGLE Mali ReadPixels Clip/Pack-State v1</title>
<pre id=o>starting...</pre>
<script>
const out=document.getElementById("o");
function log(s){out.textContent+=s+"\n"}
function hex(v){return "0x"+v.toString(16)}
function check(gl,name,fn){
  try{
    gl.getError();
    fn();
    const e=gl.getError();
    log(name+": "+(e===gl.NO_ERROR?"PASS":"GL_ERROR "+hex(e)));
  }catch(e){log(name+": EXCEPTION "+e)}
}
function makeGL(){
  const c=document.createElement("canvas");
  c.width=32;c.height=32;
  const gl=c.getContext("webgl2",{antialias:false,preserveDrawingBuffer:true});
  if(!gl){log("NO WEBGL2");return null}
  return gl;
}
function sentinelTest(gl,name,area,skipRows,skipPixels,rowLength){
  const w=area[2], h=area[3], bpp=4;
  const stride=(rowLength||w)*bpp;
  const base=256;
  const needed=base + skipRows*stride + skipPixels*bpp + h*stride + 256;
  const pbo=gl.createBuffer();
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER,pbo);
  gl.bufferData(gl.PIXEL_PACK_BUFFER,needed,gl.STREAM_READ);
  const before=new Uint8Array(needed); before.fill(0xA5);
  gl.bufferSubData(gl.PIXEL_PACK_BUFFER,0,before);

  gl.pixelStorei(gl.PACK_ALIGNMENT,1);
  gl.pixelStorei(gl.PACK_ROW_LENGTH,rowLength);
  gl.pixelStorei(gl.PACK_SKIP_ROWS,skipRows);
  gl.pixelStorei(gl.PACK_SKIP_PIXELS,skipPixels);

  gl.readPixels(area[0],area[1],area[2],area[3],gl.RGBA,gl.UNSIGNED_BYTE,base);

  const err=gl.getError();
  let data=new Uint8Array(needed);
  gl.getBufferSubData(gl.PIXEL_PACK_BUFFER,0,data);

  // Detect writes outside the expected destination envelope.
  const lo=base + skipRows*stride + skipPixels*bpp;
  const hi=lo + h*stride;
  let outside=0, inside=0;
  for(let i=0;i<data.length;i++){
    if(data[i]!==0xA5){
      if(i<lo || i>=hi) outside++;
      else inside++;
    }
  }
  log(name+": "+(err===gl.NO_ERROR?"NO_ERROR":"ERR "+hex(err))+
      " inside="+inside+" outside="+outside+
      " range=["+lo+","+hi+")");
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER,null);
  gl.deleteBuffer(pbo);
}

const gl=makeGL();
if(gl){
  gl.viewport(0,0,32,32);
  gl.clearColor(0.25,0.5,0.75,1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  log("WebGL2 OK");
  log("renderer="+gl.getParameter(gl.RENDERER));
  log("version="+gl.getParameter(gl.VERSION));

  // A: left/top clipping + skip state, small row length.
  check(gl,"A",()=>sentinelTest(gl,"A clip-left/top + skip",[-8,-6,16,16],2,3,20));

  // B: clipping on right/bottom while preserving original row stride.
  check(gl,"B",()=>sentinelTest(gl,"B clip-right/bottom + skip",[24,24,16,16],3,2,24));

  // C: both-side clipping and row-length == requested width.
  check(gl,"C",()=>sentinelTest(gl,"C both clip + tight rowLength",[-4,24,12,12],1,1,12));

  // D: state churn between valid reads; catches stale ANGLE/backend PACK state.
  check(gl,"D",()=>{
    sentinelTest(gl,"D1 clipped",[-6,8,14,14],1,2,18);
    sentinelTest(gl,"D2 unclipped",[4,4,12,12],0,0,16);
    sentinelTest(gl,"D3 clipped again",[28,-5,12,14],2,1,20);
  });

  gl.pixelStorei(gl.PACK_ROW_LENGTH,0);
  gl.pixelStorei(gl.PACK_SKIP_ROWS,0);
  gl.pixelStorei(gl.PACK_SKIP_PIXELS,0);
  log("DONE");
}
</script>
