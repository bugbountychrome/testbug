<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullscreen Folder Access</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    color: #eee;
    gap: 20px;
  }
  button {
    padding: 14px 28px;
    font-size: 18px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  #fileList {
    width: 80%;
    max-height: 50vh;
    overflow-y: auto;
    background: #1e1e1e;
    border-radius: 8px;
    padding: 16px;
    display: none;
  }
  .file { padding: 6px 0; border-bottom: 1px solid #333; font-size: 14px; }
</style>
</head>
<body>

<h1>Klik tombol untuk masuk Fullscreen</h1>
<button id="fsBtn">Masuk Fullscreen</button>
<div id="fileList"></div>

<script>
const fsBtn = document.getElementById('fsBtn');
const fileList = document.getElementById('fileList');
let dirHandle = null;

fsBtn.addEventListener('click', async () => {
  try {
    // 1. Masuk fullscreen
    await document.documentElement.requestFullscreen();

    // 2. Minta akses folder (harus dipanggil dari gesture user, klik tombol ini)
    dirHandle = await window.showDirectoryPicker();
    await listFolder(dirHandle);
  } catch (err) {
    // user membatalkan picker atau fullscreen ditolak
    console.warn(err);
    if (err.name !== 'AbortError') alert('Gagal: ' + err.message);
  }
});

async function listFolder(handle, indent = '') {
  fileList.style.display = 'block';
  fileList.innerHTML = ''; // reset
  await walk(handle, indent);
}

async function walk(dir, indent) {
  for await (const [name, entry] of dir.entries()) {
    const div = document.createElement('div');
    div.className = 'file';
    div.textContent = indent + (entry.kind === 'directory' ? '📁 ' : '📄 ') + name;
    fileList.appendChild(div);
    if (entry.kind === 'directory') {
      await walk(entry, indent + '  ');
    }
  }
}

// Keluar fullscreen saat tekan ESC (otomatis oleh browser)
</script>

</body>
</html>
