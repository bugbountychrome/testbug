<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>window.name — Destination Test</title>
<style>
body{font:16px sans-serif;margin:20px;line-height:1.5}
pre{background:#eee;color:#111;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<h2>Chromium window.name — Destination B</h2>

<p>Destination URL:</p>
<pre id="url"></pre>

<p>Received window.name:</p>
<pre id="value"></pre>

<p>Marker comparison:</p>
<pre id="result"></pre>

<p>Page lifecycle:</p>
<pre id="events"></pre>

<script>
const EXPECTED = "OMNIBOX-TEST-5812";
const records = [];

function render() {
  const value = window.name;

  document.getElementById("url").textContent = location.href;
  document.getElementById("value").textContent = JSON.stringify(value);

  document.getElementById("result").textContent =
    value === EXPECTED ? "MATCH: marker received" :
    value === "" ? "EMPTY: window.name was cleared" :
    "DIFFERENT: received another value";

  document.getElementById("events").textContent =
    records.join("\n");
}

window.addEventListener("pageshow", event => {
  records.push(
    new Date().toISOString() +
    " | pageshow.persisted=" + event.persisted +
    " | window.name=" + JSON.stringify(window.name)
  );
  render();
});

window.addEventListener("pagehide", event => {
  records.push(
    new Date().toISOString() +
    " | pagehide.persisted=" + event.persisted +
    " | window.name=" + JSON.stringify(window.name)
  );
  render();
});

render();
</script>
</body>
</html>
